# =============================================================================
# Analysis configuration for the STAR + RSeQC + TEtranscripts Snakemake
# workflow. This is the file you edit to run an analysis; tool versions
# live separately in config/versions.yaml (rarely needs touching).
# =============================================================================

# Path to the sample sheet (design file). See config/samples.csv for the
# expected format and workflow/schemas/samples.schema.yaml for validation
# rules. Per-sample strandedness overrides also live there (see the
# "strandedness" column) -- not in this file.
samples: config/samples.csv

ref:
  # Genomic FASTA sequence, e.g. GRCh38 primary assembly. Plain or gzipped
  # (.fa.gz) both work -- gzipped files are decompressed automatically.
  fasta: resources/genome.fa
  # Gene annotation GTF (Ensembl/GENCODE), used for the STAR index, RSeQC BED12
  # generation, and as the "--GTF" gene annotation for TEtranscripts/TEcount.
  # Plain or gzipped (.gtf.gz) both work.
  gtf: resources/genome.gtf
  # Curated TE GTF file from the TEtranscripts authors, REQUIRED.
  # Download from https://www.mghlab.org/software/tetranscripts (choose the
  # file matching your genome build), do NOT use a generic RepeatMasker GTF.
  # Plain or gzipped (.gtf.gz) both work.
  te_gtf: resources/te_annotation.gtf
  # sjdbOverhang for the STAR genome index. "auto" (recommended, and the
  # default) detects it from the sample sheet's fastq files as
  # max(read length) - 1, STAR's own recommendation -- no need to know your
  # read length ahead of time, and it adapts automatically if you add
  # samples with a different read length later. Set an explicit integer
  # here instead to pin it (e.g. if your fastq files aren't downloaded yet
  # when you first run the workflow).
  sjdb_overhang: auto

star:
  # Directory that will hold (or already holds) the STAR genome index.
  # If the index is missing, the workflow builds it automatically.
  index: resources/star_index
  # Extra STAR alignment parameters. The multi-mapper settings below follow
  # the TEtranscripts authors' recommendations (winAnchorMultimapNmax should
  # be >= outFilterMultimapNmax, and at least 50):
  # https://github.com/mhammell-laboratory/TEtranscripts#recommendations-for-tetranscripts-input-files
  extra: >-
    --outFilterMultimapNmax 100
    --winAnchorMultimapNmax 100
    --outFilterType BySJout
    --outFilterMultimapScoreRange 1
    --sjdbScore 1

strandedness:
  # Whether/which samples get RSeQC auto-detection is controlled per-sample
  # by the "strandedness" column in samples.csv (auto/forward/reverse/
  # unstranded; blank = auto). The only workflow-wide knob left here is the
  # confidence threshold used whenever auto-detection runs: if the fraction
  # of reads supporting the called strand is below this value, the library
  # is called "no" (unstranded) rather than guessing.
  min_fraction: 0.6

tetranscripts:
  # TE counting mode: "multi" distributes multi-mapping reads across all their
  # alignments (recommended, and the TEtranscripts default), "uniq" only uses
  # uniquely-mapping reads.
  mode: multi
  # FDR cutoff for differential-expression significance (TEtranscripts --padj)
  padj: 0.05
  # Absolute log2 fold-change cutoff (TEtranscripts --foldchange)
  foldchange: 1
  # Minimum read count cutoff (TEtranscripts --minread)
  minread: 1
  # Extra command-line arguments passed verbatim to TEtranscripts/TEcount
  extra: ""

# Differential gene/TE enrichment (TEtranscripts + DESeq2) is fully automatic:
# if config/samples.csv has a "condition" column, the workflow generates one
# TEtranscripts run for every pairwise combination of distinct condition
# values (e.g. control/treatment/knockout -> 3 contrasts). If the "condition"
# column is absent, differential analysis is skipped and the workflow stops
# after per-sample TEcount quantification. Nothing to configure here.
