name: CI
on:
  push:
    branches: [main, singularity-replacement]
  pull_request:
    branches: [main]

jobs:
  dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: rnaseq-star-tetranscripts
          environment-file: environment.yaml
          channel-priority: strict
          cache-environment: true
      - name: Build container image
        shell: bash -l {0}
        run: docker build -t rnaseq-star-tetranscripts .
      - shell: bash -l {0}
        run: snakemake --configfile config/test.yaml --sdm docker --cores 2 -n

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: rnaseq-star-tetranscripts
          environment-file: environment.yaml
          channel-priority: strict
          cache-environment: true
      - name: Build container image
        shell: bash -l {0}
        run: docker build -t rnaseq-star-tetranscripts .
      - shell: bash -l {0}
        run: snakemake --configfile config/test.yaml --sdm docker --cores 2
