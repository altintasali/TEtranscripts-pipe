name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flowchart:
    # Keeps docs/pipeline-flowchart.md (the full, rule-level Mermaid diagram
    # -- README has a small hand-authored one instead) in sync with the
    # actual rules: the generator is deterministic (rulegraph of the bundled
    # test config), so a diff means the committed diagram is stale. The
    # wiki's copy of this file is a manual refresh, not CI-enforced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tetranscripts-pipe
          environment-file: workflow/environment.yaml
          channel-priority: flexible
      - shell: bash -l {0}
        run: |
          snakemake --configfile config/test.yaml --rulegraph | python workflow/scripts/flowchart.py --update-doc
          git diff --exit-code -- docs/pipeline-flowchart.md

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tetranscripts-pipe
          environment-file: workflow/environment.yaml
          channel-priority: flexible
      - shell: bash -l {0}
        run: |
          snakemake --configfile config/test.yaml --cores 2

  guards:
    # Negative tests for the parse-time startup checks in common.smk: each
    # step asserts the documented behavior, including the ones that must FAIL
    # (missing reference / already-trimmed fastqs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tetranscripts-pipe
          environment-file: workflow/environment.yaml
          channel-priority: flexible
      - shell: bash -l {0}
        run: |
          # GitHub Actions' runner executes this block under `set -e` and
          # injects a `/usr/bin/clear_console -q` call into the exit path.
          # That helper exits non-zero on non-TTY runners, so under `set -e`
          # it flipped an otherwise fully-passing run (all 10 checks done,
          # FAIL=0) into a zero-output "Process completed with exit code 1"
          # -- the unexplained guards failure on main. This script reports
          # its own failures via $FAIL and `exit $FAIL`, so -e is explicitly
          # disabled here; -u and pipefail are kept.
          set +e -uo pipefail
          T=$(mktemp -d)
          FAIL=0
          echo "[guards] 1/42 missing reference"

          # --- a missing/typo'd reference is a hard parse-time error ---------
          sed 's|  fasta: .*|  fasta: /nonexistent/ref.fa|' config/test.yaml > "$T/missing_ref.yaml"
          if snakemake --configfile "$T/missing_ref.yaml" -n --cores 1 >"$T/missing_ref.log" 2>&1; then
            echo "ERROR: missing reference did not fail the run"; FAIL=1
          elif ! grep -q "Missing reference file(s)" "$T/missing_ref.log"; then
            echo "ERROR: wrong failure message for missing reference"; FAIL=1
          fi

          echo "[guards] 2/42 already-trimmed fastqs"

          # --- already-trimmed-looking fastqs are rejected while trimming on --
          printf 'sample,fastq_1,fastq_2,strandedness,condition\nzyg_wt_01,zyg_wt_01_trimmed.fq.gz,,auto,wt\n' > "$T/trimmed.csv"
          sed "s|samples: .*|samples: $T/trimmed.csv|" config/test.yaml > "$T/trimmed.yaml"
          if snakemake --configfile "$T/trimmed.yaml" -n --cores 1 >"$T/trimmed.log" 2>&1; then
            echo "ERROR: already-trimmed fastqs did not fail the run"; FAIL=1
          elif ! grep -q "already look trimmed" "$T/trimmed.log"; then
            echo "ERROR: wrong failure message for already-trimmed fastqs"; FAIL=1
          fi

          echo "[guards] 3/42 node-local decompressed_dir, plain refs"

          # --- node-local decompressed_dir is fine with plain refs ------------
          # (no gunzip_reference jobs run, so the setting is dead config)
          sed 's|  sjdb_overhang: 49|  sjdb_overhang: 49\n  decompressed_dir: /tmp/rnaseq-decompressed|' config/test.yaml > "$T/tmpdir_plain.yaml"
          if ! snakemake --configfile "$T/tmpdir_plain.yaml" -n --cores 1 >"$T/tmpdir_plain.log" 2>&1; then
            echo "ERROR: node-local decompressed_dir with plain refs must still dry-run"; FAIL=1
          fi

          echo "[guards] 4/42 gzipped refs, default decompressed_dir"

          # --- gzipped references: make .gz copies of the test refs ------------
          gzip -c .tests/resources/genome.fa > "$T/genome.fa.gz"
          gzip -c .tests/resources/genome.gtf > "$T/genome.gtf.gz"
          gzip -c .tests/resources/te_annotation.gtf > "$T/te_annotation.gtf.gz"
          sed -e "s|  fasta: .*|  fasta: $T/genome.fa.gz|" \
              -e "s|  gtf: .*|  gtf: $T/genome.gtf.gz|" \
              -e "s|  te_gtf: .*|  te_gtf: $T/te_annotation.gtf.gz|" \
              config/test.yaml > "$T/gz.yaml"

          # --- gz refs + default decompressed_dir: dry-run must succeed --------
          if ! snakemake --configfile "$T/gz.yaml" -n --cores 1 >"$T/gz.log" 2>&1; then
            echo "ERROR: gzipped refs with default decompressed_dir must dry-run"; FAIL=1
          fi

          echo "[guards] 5/42 gz refs + node-local decompressed_dir"

          # --- gz refs + node-local /tmp decompressed_dir: hard parse error ----
          sed 's|  sjdb_overhang: 49|  sjdb_overhang: 49\n  decompressed_dir: /tmp/rnaseq-decompressed|' "$T/gz.yaml" > "$T/gz_tmpdir.yaml"
          if snakemake --configfile "$T/gz_tmpdir.yaml" -n --cores 1 >"$T/gz_tmpdir.log" 2>&1; then
            echo "ERROR: gz refs + node-local decompressed_dir did not fail the run"; FAIL=1
          elif ! grep -q "node-local temp directory" "$T/gz_tmpdir.log"; then
            echo "ERROR: wrong failure message for gz refs + node-local decompressed_dir"; FAIL=1
          fi

          echo "[guards] 6/42 gz refs + empty decompressed_dir"

          # --- gz refs + empty decompressed_dir: hard parse error ---------------
          sed 's|  sjdb_overhang: 49|  sjdb_overhang: 49\n  decompressed_dir: ""|' "$T/gz.yaml" > "$T/gz_empty.yaml"
          if snakemake --configfile "$T/gz_empty.yaml" -n --cores 1 >"$T/gz_empty.log" 2>&1; then
            echo "ERROR: gz refs + empty decompressed_dir did not fail the run"; FAIL=1
          elif ! grep -q "(empty)" "$T/gz_empty.log"; then
            echo "ERROR: wrong failure message for gz refs + empty decompressed_dir"; FAIL=1
          fi

          echo "[guards] 7/42 star.index omitted"

          # --- star.index omitted: defaults to generated results/star_index -----
          sed '/^  index: .*star_index$/d' config/test.yaml > "$T/no_index.yaml"
          if ! snakemake --configfile "$T/no_index.yaml" -n --cores 1 >"$T/no_index.log" 2>&1; then
            echo "ERROR: omitted star.index must dry-run (default results/star_index)"; FAIL=1
          elif ! grep -q "results/star_index" "$T/no_index.log"; then
            echo "ERROR: default star index path results/star_index not used"; FAIL=1
          fi

          echo "[guards] 8/42 star.index empty"

          # --- star.index empty string: same default applies --------------------
          sed 's|^  index: .*|  index: ""|' config/test.yaml > "$T/empty_index.yaml"
          if ! snakemake --configfile "$T/empty_index.yaml" -n --cores 1 >"$T/empty_index.log" 2>&1; then
            echo "ERROR: empty star.index must dry-run (default results/star_index)"; FAIL=1
          fi

          echo "[guards] 9/42 CLI samples generator"

          # --- the samples CLI must reproduce the committed fixture -----------
          # (same rows, order-insensitive; generated paths are absolute while
          # the fixture's are relative, so compare basenames)
          python workflow/scripts/tetranscripts-pipe samples --reads .tests/reads --dry-run > "$T/cli_sheet.csv" 2> "$T/cli_samples.err"
          if [ $? -ne 0 ]; then
            echo "ERROR: samples generator failed"; cat "$T/cli_samples.err"; FAIL=1
          else
            norm() { grep -v '^#' "$1" | grep -v '^sample,' | cut -d, -f1-3 | sed -E 's|,[^,]*/|,|g' | sort; }
            norm "$T/cli_sheet.csv" > "$T/cli_norm.txt"
            norm .tests/samples.csv > "$T/fixture_norm.txt"
            if ! diff "$T/cli_norm.txt" "$T/fixture_norm.txt" > /dev/null; then
              echo "ERROR: samples generator output differs from the committed fixture"
              diff "$T/cli_norm.txt" "$T/fixture_norm.txt"
              FAIL=1
            fi
          fi

          echo "[guards] 10/42 CLI run --dry-run"

          # --- CLI run must scaffold config + sheet and pass a real dry-run ---
          python workflow/scripts/tetranscripts-pipe run \
            --config "$T/cli/config.yaml" --samplesheet "$T/cli/samples.csv" \
            --reads .tests/reads \
            --fasta .tests/resources/genome.fa \
            --gtf .tests/resources/genome.gtf \
            --te-gtf .tests/resources/te_annotation.gtf \
            --cores 2 --dry-run > "$T/cli_run.log" 2>&1
          CLI_RC=$?
          if [ $CLI_RC -ne 0 ]; then
            echo "ERROR: CLI run --dry-run failed (exit $CLI_RC)"; tail -40 "$T/cli_run.log"; FAIL=1
          elif ! grep -q "dry-run OK" "$T/cli_run.log"; then
            echo "ERROR: CLI run --dry-run did not report success"; tail -40 "$T/cli_run.log"; FAIL=1
          elif ! grep -q "Job stats:" "$T/cli_run.log" || ! grep -q "tecount" "$T/cli_run.log"; then
            echo "ERROR: CLI run --dry-run planned no jobs (tecount missing from the DAG)"; tail -40 "$T/cli_run.log"; FAIL=1
          fi

          echo "[guards] 11/42 MultiQC custom-content JSON format"

          # --- the barplot emitters must render in the installed MultiQC ------
          # MultiQC's custom_content module only reads a top-level "data" key;
          # the legacy "samples"/"datasets" shape yields "No data found" and the
          # section is silently dropped (regressed in v0.6.1). Run both scripts
          # on synthetic fixtures and confirm MultiQC renders all four sections.
          printf 'metric\tvalue\nsample\ta\nevents_total\t10\ndirection_gene_to_te\t2\ndirection_te_to_gene\t1\ndirection_gene_to_gene\t4\ndirection_te_to_te\t0\ndirection_gene_to_other\t1\ndirection_other_to_gene\t2\ndirection_te_to_other\t0\ndirection_other_to_te\t1\ndirection_other\t0\n' > "$T/jqc_a.tsv"
          printf 'metric\tvalue\nsample\tb\nevents_total\t0\ndirection_gene_to_te\t0\ndirection_te_to_gene\t0\ndirection_gene_to_gene\t0\ndirection_te_to_te\t0\ndirection_gene_to_other\t0\ndirection_other_to_gene\t0\ndirection_te_to_other\t0\ndirection_other_to_te\t0\ndirection_other\t0\n' > "$T/jqc_b.tsv"
          printf 'gene/TE\t/path/a.bam\nENSG0001\t80\nL1PA_0001:L1:LINE\t5\nAluYb_001:AluYb:SINE\t7\n' > "$T/a.cntTable"
          printf 'gene/TE\t/path/b.bam\nENSG0001\t0\nL1PA_0001:L1:LINE\t0\n' > "$T/b.cntTable"
          mkdir -p "$T/custom/chimera/qc" "$T/custom/tecount/qc"
          if ! python workflow/scripts/junction_qc_mqc.py \
                --tables "$T/jqc_a.tsv" "$T/jqc_b.tsv" --samples a b \
                --out "$T/custom/chimera/qc/junction_qc_mqc.json" \
                --out-te-gene-chimeras "$T/custom/chimera/qc/te_gene_chimeras_mqc.json" > "$T/jqc.log" 2>&1; then
            echo "ERROR: junction_qc_mqc.py failed"; cat "$T/jqc.log"; FAIL=1
          fi
          if ! python workflow/scripts/tecount_summary_mqc.py \
                --tables "$T/a.cntTable" "$T/b.cntTable" --samples a b \
                --out-assignment "$T/custom/tecount/qc/tecount_assignment_mqc.json" \
                --out-class "$T/custom/tecount/qc/tecount_te_class_mqc.json" > "$T/tsum.log" 2>&1; then
            echo "ERROR: tecount_summary_mqc.py failed"; cat "$T/tsum.log"; FAIL=1
          fi
          if ! multiqc --force --no-ansi -c workflow/default-config/multiqc_config.yaml \
                -o "$T/mqc" -n report "$T/custom" > "$T/mqc.log" 2>&1; then
            echo "ERROR: multiqc run failed"; tail -40 "$T/mqc.log"; FAIL=1
          else
            for cid in chimera_junction_qc chimera_te_gene_chimeras \
                       tecount_assignment tecount_te_class; do
              if ! grep -q "custom_content | $cid: Found" "$T/mqc.log" \
                 || [ ! -f "$T/mqc/report_data/multiqc_${cid}_plot.txt" ]; then
                echo "ERROR: section '$cid' not rendered by MultiQC"
                grep "custom_content" "$T/mqc.log" | head -20
                ls "$T/mqc/report_data" | grep "${cid}" || true
                FAIL=1
              fi
            done
          fi

          echo "[guards] 12/42 CLI run with an existing config (config-only)"

          # --- CLI run with an existing --config: no other flags needed -------
          # The sheet is taken from the config's 'samples:' key
          # (config/test.yaml -> .tests/samples.csv), resolved repo-root
          # relative like snakemake itself does.
          python workflow/scripts/tetranscripts-pipe run \
            --config config/test.yaml --cores 2 --dry-run > "$T/cli_config_only.log" 2>&1
          CLI_RC=$?
          if [ $CLI_RC -ne 0 ]; then
            echo "ERROR: CLI run --config-only dry-run failed (exit $CLI_RC)"; tail -40 "$T/cli_config_only.log"; FAIL=1
          elif ! grep -q "dry-run OK" "$T/cli_config_only.log"; then
            echo "ERROR: CLI run --config-only did not report success"; tail -40 "$T/cli_config_only.log"; FAIL=1
          elif ! grep -q "Job stats:" "$T/cli_config_only.log" || ! grep -q "tecount_summary" "$T/cli_config_only.log"; then
            echo "ERROR: CLI run --config-only planned no jobs (tecount_summary missing)"; tail -40 "$T/cli_config_only.log"; FAIL=1
          fi

          echo "[guards] 13/42 qc-off keeps the summary barplots"

          # --- tetranscripts.qc.enabled: false still plans the summary barplots
          # The assignment + TE-class barplots use the raw cntTables, so they
          # are decoupled from the R-based sample-QC view (v0.6.5). The 4-space
          # indent pins this to tetranscripts.qc.enabled (not trimming/chimera).
          sed 's/^    enabled: true/    enabled: false/' config/test.yaml > "$T/qc_off.yaml"
          if ! snakemake --configfile "$T/qc_off.yaml" -n --cores 1 >"$T/qc_off.log" 2>&1; then
            echo "ERROR: qc-off config must dry-run"; tail -40 "$T/qc_off.log"; FAIL=1
          elif ! grep -q "tecount_summary" "$T/qc_off.log"; then
            echo "ERROR: tecount_summary not planned with tetranscripts.qc.enabled false"; tail -40 "$T/qc_off.log"; FAIL=1
          elif grep -qE "tecount_counts|tecount_qc_transform" "$T/qc_off.log"; then
            echo "ERROR: R-based tecount QC rules still planned with tetranscripts.qc.enabled false"; tail -40 "$T/qc_off.log"; FAIL=1
          fi

          echo "[guards] 14/42 CLI with config in a different checkout (deployed split)"

          # --- CLI installed elsewhere, config in an analysis checkout -------
          # The deployment runs this script from a shared apps/ copy while
          # pointing --config at an analysis working copy. Relative paths in
          # the config (samples: input/samples.csv) must then resolve against
          # the analysis checkout, and snakemake must run from that root.
          WD2="$T/deployed_wd"
          mkdir -p "$WD2"
          cp -r workflow config .tests "$WD2/"
          mkdir -p "$WD2/input"
          sed 's|samples: .*|samples: input/samples.csv|' config/test.yaml > "$WD2/input/config.yaml"
          cp .tests/samples.csv "$WD2/input/samples.csv"
          python workflow/scripts/tetranscripts-pipe run \
            --config "$WD2/input/config.yaml" --cores 2 --dry-run > "$T/deployed.log" 2>&1
          DEPLOY_RC=$?
          if [ $DEPLOY_RC -ne 0 ]; then
            echo "ERROR: CLI run with a config in another checkout failed (exit $DEPLOY_RC)"; tail -40 "$T/deployed.log"; FAIL=1
          elif ! grep -q "dry-run OK" "$T/deployed.log"; then
            echo "ERROR: deployed-split run did not report success"; tail -40 "$T/deployed.log"; FAIL=1
          elif ! grep -q "$WD2" "$T/deployed.log"; then
            echo "ERROR: run did not anchor to the config's checkout ($WD2)"; tail -40 "$T/deployed.log"; FAIL=1
          fi

          echo "[guards] 15/42 build_index=false: index must look like an index"

          # --- build_index=false pointing at a directory that exists but has
          # no STAR index in it is rejected at parse time, not hours later
          # when the first alignment job fails inside STAR.
          mkdir -p "$T/empty_index"
          sed -e 's|^  index: .*|  index: '"$T"'/empty_index\n  build_index: false|' \
              config/test.yaml > "$T/notanindex.yaml"
          if snakemake --configfile "$T/notanindex.yaml" -n --cores 1 \
              >"$T/notanindex.log" 2>&1; then
            echo "ERROR: build_index=false with an empty index dir did not fail"; FAIL=1
          elif ! grep -q "does not look like a STAR index" "$T/notanindex.log"; then
            echo "ERROR: wrong failure message for non-index directory"; FAIL=1
          fi

          echo "[guards] 16/42 external STAR index is used in place, never deleted"

          # --- The core safety property of build_index: false -- the user's
          # external index is a plain INPUT.  No rule may declare it as an
          # output (Snakemake wipes a directory() output before the job runs)
          # and cleanup_star_index must not touch it even with
          # keep_star_index: false.  Fake index: STAR loads SA/SAindex/Genome,
          # and those are what common.smk checks for.
          mkdir -p "$T/fake_star_index"
          touch "$T/fake_star_index/SA" "$T/fake_star_index/SAindex" \
                "$T/fake_star_index/Genome"
          sed -e 's|^  index: .*|  index: '"$T"'/fake_star_index|' \
              config/test.yaml > "$T/ksif.yaml"
          sed -e '/^  index: /a\  build_index: false' "$T/ksif.yaml" > "$T/ksif2.yaml"
          mv "$T/ksif2.yaml" "$T/ksif.yaml"
          sed -e '/^outputs:/a\'$'\n''  keep_star_index: false' "$T/ksif.yaml" > "$T/ksif2.yaml"
          mv "$T/ksif2.yaml" "$T/ksif.yaml"
          if ! snakemake --configfile "$T/ksif.yaml" -n --cores 1 -p \
              >"$T/ksif.log" 2>&1; then
            echo "ERROR: keep_star_index=false dry-run failed"; tail -20 "$T/ksif.log"; FAIL=1
          elif grep -q "^rule star_index:" "$T/ksif.log"; then
            echo "ERROR: star_index rule planned although build_index=false"; FAIL=1
          elif grep -qE "rm -rf '?[^ ']*fake_star_index" "$T/ksif.log"; then
            # Deliberately anchored to the token right after rm -rf: a loose
            # "rm -rf.*fake_star_index" also matches STAR's own
            # "rm -rf <outTmpDir> ... --genomeDir <index>" command line.
            echo "ERROR: external STAR index reached an rm -rf"; FAIL=1
          elif ! grep -q "fake_star_index" "$T/ksif.log"; then
            echo "ERROR: external STAR index not used by the alignment jobs"; FAIL=1
          fi

          # --- ...and with build_index: true the index we built ourselves IS
          # cleaned up, so the knob still does what it says.
          sed -e '/^outputs:/a\'$'\n''  keep_star_index: false' \
              config/test.yaml > "$T/ksit.yaml"
          if ! snakemake --configfile "$T/ksit.yaml" -n --cores 1 -p \
              >"$T/ksit.log" 2>&1; then
            echo "ERROR: build_index=true keep_star_index=false dry-run failed"
            tail -20 "$T/ksit.log"; FAIL=1
          elif ! grep -q "cleanup_star_index" "$T/ksit.log"; then
            echo "ERROR: cleanup_star_index rule not planned when we built the index"; FAIL=1
          fi

          echo "[guards] 17/42 build_index=false without ref.fasta"

          # --- build_index=false: ref.fasta is optional.  Remove fasta from
          # the config and confirm the dry-run still passes.
          sed -e 's|^  index: .*|  index: '"$T"'/fake_star_index|' \
              -e '/^  fasta: /d' \
              config/test.yaml > "$T/no_fasta.yaml"
          sed -e '/^  index: /a\  build_index: false' "$T/no_fasta.yaml" > "$T/no_fasta2.yaml"
          mv "$T/no_fasta2.yaml" "$T/no_fasta.yaml"
          if ! snakemake --configfile "$T/no_fasta.yaml" -n --cores 1 >"$T/no_fasta.log" 2>&1; then
            echo "ERROR: build_index=false without ref.fasta failed"; tail -20 "$T/no_fasta.log"; FAIL=1
          elif grep -q "Missing reference" "$T/no_fasta.log"; then
            echo "ERROR: build_index=false without ref.fasta raised missing reference error"; FAIL=1
          fi

          echo "[guards] 18/42 empty GTF warning"

          # --- an empty-but-existing GTF must produce a parse-time warning
          # (not an error) during dry-run.
          touch "$T/empty.gtf"
          sed -e "s|  gtf: .*|  gtf: $T/empty.gtf|" \
              config/test.yaml > "$T/empty_gtf.yaml"
          if ! snakemake --configfile "$T/empty_gtf.yaml" -n --cores 1 >"$T/empty_gtf.log" 2>&1; then
            echo "ERROR: empty GTF dry-run failed"; tail -20 "$T/empty_gtf.log"; FAIL=1
          elif ! grep -q "no feature lines" "$T/empty_gtf.log"; then
            echo "ERROR: empty GTF did not produce expected warning"; tail -20 "$T/empty_gtf.log"; FAIL=1
          fi

          echo "[guards] 19/42 check_nonempty_fastq rejects empty file"

          # --- check_nonempty_fastq.py must exit 1 for an empty FASTQ
          echo -n "" | gzip > "$T/empty.fq.gz"
          if python3 workflow/scripts/check_nonempty_fastq.py "$T/empty.fq.gz" >/dev/null 2>&1; then
            echo "ERROR: check_nonempty_fastq accepted an empty FASTQ"; FAIL=1
          fi

          echo "[guards] 20/42 telocal enabled with empty locind auto-builds"

          # --- telocal.enabled: true with empty locind must now succeed
          # (auto-builds from TE GTF via telocal_locind rule)
          printf '\ntelocal:\n  enabled: true\n  locind: ""\n' >> "$T/telocal_empty_locind.yaml"
          cat config/test.yaml "$T/telocal_empty_locind.yaml" > "$T/telocal_auto.yaml"
          if ! snakemake --configfile "$T/telocal_auto.yaml" -n --cores 1 >"$T/telocal_auto.log" 2>&1; then
            echo "ERROR: telocal enabled with empty locind failed (auto-build should work)"
            tail -20 "$T/telocal_auto.log"
            FAIL=1
          elif ! grep -q "telocal_locind" "$T/telocal_auto.log"; then
            echo "ERROR: telocal_locind rule not triggered in auto-build mode"
            FAIL=1
          fi

          echo "[guards] 21/42 telocal_summary_mqc.py + telocal counts matrix"

          # --- telocal_summary_mqc.py must render in MultiQC ------------------
          printf 'gene/TE\t/path/a.bam\nENSG0001\t80\nchr1:100:200(L1PA2:+):L1PA2:L1:LINE\t5\n' > "$T/tl_a.cntTable"
          printf 'gene/TE\t/path/b.bam\nENSG0001\t0\nchr1:100:200(L1PA2:+):L1PA2:L1:LINE\t0\n' > "$T/tl_b.cntTable"
          mkdir -p "$T/custom/telocal/qc"
          if ! python workflow/scripts/telocal_summary_mqc.py \
                --tables "$T/tl_a.cntTable" "$T/tl_b.cntTable" --samples a b \
                --out-assignment "$T/custom/telocal/qc/telocal_assignment_mqc.json" \
                --out-class "$T/custom/telocal/qc/telocal_te_class_mqc.json" > "$T/tlsum.log" 2>&1; then
            echo "ERROR: telocal_summary_mqc.py failed"; cat "$T/tlsum.log"; FAIL=1
          fi

          # --- tecount_counts.py --key-style telocal classifies by shape ------
          # TE-locus keys (>= 3 colon fields) are kept with --feature-class TE;
          # gene keys (no colons) are dropped.
          if ! python workflow/scripts/tecount_counts.py \
                --tables "$T/tl_a.cntTable" "$T/tl_b.cntTable" --sample-names a b \
                --key-style telocal --feature-class TE \
                --out-counts "$T/telocal_counts_matrix.tsv" > "$T/tlcounts.log" 2>&1; then
            echo "ERROR: tecount_counts.py --key-style telocal failed"; cat "$T/tlcounts.log"; FAIL=1
