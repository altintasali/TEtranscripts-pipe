            # the regression itself: no interval may span the two distant copies
            if awk -F'\t' '$3 - $2 > 100000 {found=1} END{exit !found}' "$T/tebed/out/te.bed"; then
              echo "ERROR: te.bed has a >100kb interval -- subfamily bounding-box bug is back"
              cat "$T/tebed/out/te.bed"; FAIL=1
            fi
            # fragmented insertion merged into one 7000-7300 interval
            if ! awk -F'\t' '$4=="L1PA2_dup3" && $2==6999 && $3==7300 {found=1} END{exit !found}' "$T/tebed/out/te.bed"; then
              echo "ERROR: fragments sharing a transcript_id were not merged"
              cat "$T/tebed/out/te.bed"; FAIL=1
            fi
            # subfamily kept in col 9 (TEcount cross-reference depends on it)
            if ! awk -F'\t' '$4=="L1PA2_dup1" && $9=="L1PA2" {found=1} END{exit !found}' "$T/tebed/out/te.bed"; then
              echo "ERROR: te.bed col 9 should carry the subfamily"; cat "$T/tebed/out/te.bed"; FAIL=1
            fi
          fi

          echo "[guards] 34/42 chimeric breakpoints resolve on BOTH strands at tolerance 0"

          # STAR's Chimeric.out.junction reports the first base of the DONOR'S
          # INTRON (col 2) and the last base of the ACCEPTOR'S INTRON (col 5)
          # -- not the aligned segment edges. The aligned base is one step
          # along the transcript, which flips sign with strand. The parser
          # used to test an off-centre window around the raw breakpoint,
          # which covered bp and bp+1 but never bp-1: acceptors landed inside
          # it and donors fell just outside, so on real data donor
          # breakpoints hit exons ~10x less often than acceptors and the
          # gene_to_te / te_to_gene ratio was skewed.
          #
          # Both junctions below are genuine gene<->TE chimeras with
          # breakpoints exactly on the feature edges. Before the fix the '+'
          # case came back other_to_te (gene missed) and the '-' case
          # gene_to_other (TE missed).
          mkdir -p "$T/bpt"
          printf 'chr1\tsrc\texon\t1000\t2000\t.\t+\t.\tgene_id "G1"; transcript_id "G1.1";\n' > "$T/bpt/genes.gtf"
          printf 'chr1\trmsk\texon\t3000\t3500\t.\t+\t.\tgene_id "L1"; transcript_id "L1_dup1"; family_id "L1"; class_id "LINE";\n' > "$T/bpt/te.gtf"
          if ! python3 workflow/scripts/annotation_to_bed.py --gtf "$T/bpt/genes.gtf" \
                --te-gtf "$T/bpt/te.gtf" --outdir "$T/bpt/ref" > "$T/bpt/bed.log" 2>&1; then
            echo "ERROR: annotation_to_bed failed"; cat "$T/bpt/bed.log"; FAIL=1
          else
            # + : donor ends at exon end 2000 -> STAR 2001 ; acceptor starts at TE 3000 -> STAR 2999
            printf 'chr1\t2001\t+\tchr1\t2999\t+\t1\t0\t0\tp1\t1\t50M\t1\t50M\n'  > "$T/bpt/j.junction"
            # - : mirrored. donor ends at 1000 -> STAR 999 ; acceptor starts at 3500 -> STAR 3501
            printf 'chr1\t999\t-\tchr1\t3501\t-\t1\t0\t0\tm1\t1\t50M\t1\t50M\n' >> "$T/bpt/j.junction"
            if ! python3 workflow/scripts/parse_chimeric_junctions.py \
                  --junctions "$T/bpt/j.junction" --genes "$T/bpt/ref/genes.bed" \
                  --exons "$T/bpt/ref/exons.bed" --te "$T/bpt/ref/te.bed" \
                  --sample s --breakpoint-tolerance 0 --library-strandedness no \
                  --out "$T/bpt/out.tsv.gz" > "$T/bpt/parse.log" 2>&1; then
              echo "ERROR: parse_chimeric_junctions failed"; cat "$T/bpt/parse.log"; FAIL=1
            else
              N=$(zcat "$T/bpt/out.tsv.gz" | awk -F'\t' 'NR==1{for(i=1;i<=NF;i++)h[$i]=i;next} $h["direction"]=="gene_to_te" && $h["gene_id"]=="G1" && $h["te_id"]=="L1_dup1"{n++} END{print n+0}')
              if [ "$N" -ne 2 ]; then
                echo "ERROR: expected 2 gene_to_te calls (one per strand), got $N"
                echo "  breakpoints sit exactly on the feature edges, so both must resolve"
                zcat "$T/bpt/out.tsv.gz" | cut -f5,8,15,17,19 | head; FAIL=1
              fi
            fi
          fi

          echo "[guards] 35/42 per-direction canonical rate reaches the report"

          # "canonical" = STAR reported any recognised splice motif. Real
          # introns are ~100% canonical, so this is the main signal-vs-
          # artifact discriminator -- and it was previously reported only
          # GLOBALLY, which hid that the gene-TE classes sit several-fold
          # above the unannotated background. Fixture: gene_to_te 10/40
          # canonical (25%), other 4/60 (6.7%).
          mkdir -p "$T/canon/qc"
          { printf 'event_id\tsample\tdirection\tdirection_ambiguous\tcanonical\tchimera_type\tantisense_flag\tgene_strand_match\n'
            for i in $(seq 1 100); do
              if [ "$i" -le 10 ]; then printf 'e%s\ts\tgene_to_te\tno\tyes\tte_initiated\tno\tyes\n' "$i"
              elif [ "$i" -le 40 ]; then printf 'e%s\ts\tgene_to_te\tno\tno\tte_initiated\tno\tyes\n' "$i"
              elif [ "$i" -le 44 ]; then printf 'e%s\ts\tother\tno\tyes\t.\t.\tNA\n' "$i"
              else printf 'e%s\ts\tother\tno\tno\t.\t.\tNA\n' "$i"; fi
            done
          } | gzip -c > "$T/canon/j.tsv.gz"
          if ! python3 workflow/scripts/junction_qc.py --table "$T/canon/j.tsv.gz" \
                --sample s --out "$T/canon/qc.tsv.gz" > "$T/canon/qc.log" 2>&1; then
            echo "ERROR: junction_qc.py failed"; cat "$T/canon/qc.log"; FAIL=1
          elif ! zcat "$T/canon/qc.tsv.gz" | grep -qx "canonical_gene_to_te	10"; then
            echo "ERROR: canonical_gene_to_te should be 10"
            zcat "$T/canon/qc.tsv.gz" | grep canonical; FAIL=1
          elif ! python3 workflow/scripts/junction_qc_mqc.py --tables "$T/canon/qc.tsv.gz" \
                --samples s --out "$T/canon/qc/junction_qc_mqc.json" \
                --out-canonical "$T/canon/qc/canonical_rate_mqc.json" > "$T/canon/mqc.log" 2>&1; then
            echo "ERROR: junction_qc_mqc.py failed"; cat "$T/canon/mqc.log"; FAIL=1
          else
            # 10/40 = 25.0% for gene_to_te, 4/60 = 6.7% for other
            if ! python3 -c "import json,sys; d=json.load(open('$T/canon/qc/canonical_rate_mqc.json'))['data'][0]['s']; sys.exit(0 if abs(d['gene_to_te']-25.0)<0.05 and abs(d['other']-6.7)<0.05 else 1)"; then
              echo "ERROR: canonical percentages wrong"
              cat "$T/canon/qc/canonical_rate_mqc.json"; FAIL=1
            fi
            if ! multiqc --force --no-ansi -c workflow/default-config/multiqc_config.yaml \
                  -o "$T/canon/mqc" -n r "$T/canon/qc" > "$T/canon/render.log" 2>&1; then
              echo "ERROR: multiqc failed on the canonical section"; tail -30 "$T/canon/render.log"; FAIL=1
            elif ! grep -q "custom_content | chimera_canonical_rate: Found" "$T/canon/render.log"; then
              echo "ERROR: canonical-rate section not rendered"
              grep custom_content "$T/canon/render.log" | head; FAIL=1
            fi
          fi

          # ...and the ALL-ZERO case, which is what the synthetic fixture
          # actually produces (its chimeric reads are random sequence, so no
          # junction carries a splice motif). An all-zero bar document makes
          # MultiQC raise "No datasets to plot" and fails the whole report,
          # so it must degrade to html. The fixture above has canonical hits
          # and therefore could not catch this.
          mkdir -p "$T/canon0/qc"
          { printf 'event_id\tsample\tdirection\tdirection_ambiguous\tcanonical\tchimera_type\tantisense_flag\tgene_strand_match\n'
            for i in $(seq 1 30); do printf 'e%s\ts\tgene_to_te\tno\tno\tte_initiated\tno\tyes\n' "$i"; done
          } | gzip -c > "$T/canon0/j.tsv.gz"
          python3 workflow/scripts/junction_qc.py --table "$T/canon0/j.tsv.gz" \
            --sample s --out "$T/canon0/qc.tsv.gz" > /dev/null 2>&1
          if ! python3 workflow/scripts/junction_qc_mqc.py --tables "$T/canon0/qc.tsv.gz" \
                --samples s --out "$T/canon0/qc/junction_qc_mqc.json" \
                --out-canonical "$T/canon0/qc/canonical_rate_mqc.json" > "$T/canon0/mqc.log" 2>&1; then
            echo "ERROR: junction_qc_mqc.py failed on all-zero canonical"; cat "$T/canon0/mqc.log"; FAIL=1
          elif ! python3 -c "import json,sys; sys.exit(0 if json.load(open('$T/canon0/qc/canonical_rate_mqc.json'))['plot_type']=='html' else 1)"; then
            echo "ERROR: all-zero canonical must degrade to plot_type html"; FAIL=1
          elif ! multiqc --force --no-ansi -c workflow/default-config/multiqc_config.yaml \
                -o "$T/canon0/mqc_out" -n r "$T/canon0/qc" > "$T/canon0/render.log" 2>&1; then
            echo "ERROR: multiqc failed on an all-zero canonical rate"
            tail -30 "$T/canon0/render.log"; FAIL=1
          fi

          echo "[guards] 36/42 unified chimera_evidence table + confidence tiers"

          # --- The unified table is the one place the two screens can be
          # compared, so its tier ladder is worth pinning: depth must NOT
          # promote a bare call, and a pair called by both screens must
          # reach tier 6.  Fixture covers one pair per tier.
          mkdir -p "$T/ev"
          { printf 'event_id\tgene_id\tte_id\tte_subfamily\tte_family\tte_class\tcanonical\tchimera_type\ttelocal_active\tn_samples\ttotal_reads\n'
            printf 'j1\tGapdh\tL1PA2_dup1\tL1PA2\tL1\tLINE\tyes\tte_terminated\tyes\t6\t50\n'
            printf 'j2\tGapdh\tL1PA2_dup1\tL1PA2\tL1\tLINE\tno\tte_exonized\t.\t2\t10\n'
            printf 'j3\tActb\tAluY_dup9\tAluY\tAlu\tSINE\tno\tte_initiated\tyes\t3\t80\n'
            printf 'j4\tMyc\tL1MdA_dup4\tL1MdA\tL1\tLINE\tyes\tte_initiated\tno\t1\t5\n'
            printf 'j5\tTp53\tMIR_dup2\tMIR\tMIR\tSINE\tno\ttrans\tno\t1\t999\n'
          } | gzip -c > "$T/ev/j.tsv.gz"
          { printf 'transcript_id\tte_id\tte_subfamily\tte_family\tte_class\tmatched_gene_id\tstrand_match\tchimera_type\n'
            printf 'MSTRG.1.1\tL1PA2_dup1\tL1PA2\tL1\tLINE\tGapdh\tyes\tte_terminated\n'
            printf 'MSTRG.9.2\tSVA_dup3\tSVA\tSVA\tRetroposon\tSox2\tyes\tte_exonized\n'
          } | gzip -c > "$T/ev/a.tsv.gz"
          if ! python3 workflow/scripts/chimera_evidence.py --junction "$T/ev/j.tsv.gz" \
                --assembly "$T/ev/a.tsv.gz" --out "$T/ev/out.tsv.gz" > "$T/ev/log" 2>&1; then
            echo "ERROR: chimera_evidence.py failed"; cat "$T/ev/log"; FAIL=1
          else
            python3 - "$T/ev/out.tsv.gz" <<'PY' || FAIL=1
          import gzip, sys
          rows = [l.rstrip("\n").split("\t") for l in gzip.open(sys.argv[1], "rt")]
          h, rows = rows[0], rows[1:]
          d = {(r[h.index("gene_id")], r[h.index("te_id")]): dict(zip(h, r)) for r in rows}
          ok = True
          def check(cond, msg):
              global ok
              if not cond:
                  print("ERROR:", msg); ok = False
          check(len(rows) == 5, f"expected 5 gene-TE pairs, got {len(rows)}")
          g = d.get(("Gapdh", "L1PA2_dup1"), {})
          check(g.get("found_by") == "both", "Gapdh pair not marked found_by both")
          check(g.get("confidence_tier") == "6", f"both-screens pair must be tier 6, got {g.get('confidence_tier')}")
          check(g.get("junction_events") == "2", "two junction events must collapse into one pair row")
          check(g.get("junction_reads") == "60", "junction reads must sum across events")
          check(g.get("junction_canonical") == "yes", "canonical on any event must set the pair canonical")
          check(d.get(("Actb", "AluY_dup9"), {}).get("confidence_tier") == "5", "telocal_active pair must be tier 5")
          check(d.get(("Myc", "L1MdA_dup4"), {}).get("confidence_tier") == "3", "canonical-only pair must be tier 3")
          t = d.get(("Tp53", "MIR_dup2"), {})
          check(t.get("confidence_tier") == "2", "999 reads must NOT promote a bare call above tier 2")
          s = d.get(("Sox2", "SVA_dup3"), {})
          check(s.get("found_by") == "assembly", "assembly-only pair mislabelled")
          check(s.get("telocal_active") == ".", "assembly-only pair must not claim a telocal verdict")
          check(rows[0][h.index("gene_id")] == "Gapdh", "table must be sorted best-first")
          sys.exit(0 if ok else 1)
          PY
          fi
          # ...and it must still work with the assembly screen off.
          if ! python3 workflow/scripts/chimera_evidence.py --junction "$T/ev/j.tsv.gz" \
                --out "$T/ev/j_only.tsv.gz" > "$T/ev/log2" 2>&1; then
            echo "ERROR: chimera_evidence.py failed without --assembly"; cat "$T/ev/log2"; FAIL=1
          elif gzip -dc "$T/ev/j_only.tsv.gz" | tail -n +2 | cut -f6 | grep -qv '^junction$'; then
            echo "ERROR: without --assembly every pair must be found_by junction"; FAIL=1
          fi

          echo "[guards] 37/42 junction 'what to look at' section renders"

          # --- The junction screen's guided entry point.  Ranking must put a
          # canonical, low-depth event above a non-canonical, high-depth one
          # (depth is the metric artifacts inflate most), and the document
          # must render in a real MultiQC run.
          mkdir -p "$T/hl/qc"
          cp "$T/ev/j.tsv.gz" "$T/hl/te-gene-chimeras.tsv.gz"
          if ! python3 workflow/scripts/junction_highlights_mqc.py \
                --te-events "$T/hl/te-gene-chimeras.tsv.gz" \
                --out "$T/hl/qc/junction_highlights_mqc.json" > "$T/hl/log" 2>&1; then
            echo "ERROR: junction_highlights_mqc.py failed"; cat "$T/hl/log"; FAIL=1
          elif ! python3 -c "
          import json,sys
          d=json.load(open('$T/hl/qc/junction_highlights_mqc.json'))
          assert 'data' in d, 'custom_content needs a top-level data key'
          assert d['parent_id']=='chimera', 'must share the Chimera parent group'
          b=d['data']
          sys.exit(0 if b.index('L1PA2_dup1') < b.index('MIR_dup2') else 1)
          "; then
            echo "ERROR: highlights must rank canonical above high-depth non-canonical"; FAIL=1
          elif ! multiqc --force --no-ansi -c workflow/default-config/multiqc_config.yaml \
                -o "$T/hl/out" -n r "$T/hl/qc" > "$T/hl/render.log" 2>&1; then
            echo "ERROR: multiqc failed on the junction highlights section"
            tail -30 "$T/hl/render.log"; FAIL=1
          elif ! grep -q "What to look at" "$T/hl/out/r.html"; then
            echo "ERROR: junction highlights section not rendered"; FAIL=1
          fi
          # An empty gene-TE table is a normal outcome and must not crash.
          printf 'event_id\tgene_id\tte_id\tcanonical\tn_samples\ttotal_reads\n' \
            | gzip -c > "$T/hl/empty.tsv.gz"
          if ! python3 workflow/scripts/junction_highlights_mqc.py \
                --te-events "$T/hl/empty.tsv.gz" --out "$T/hl/empty_mqc.json" \
                > "$T/hl/empty.log" 2>&1; then
            echo "ERROR: junction_highlights_mqc.py died on an empty table"
            cat "$T/hl/empty.log"; FAIL=1
          fi

          echo "[guards] 38/42 'Start here' evidence overview reflects what ran"

          # --- The report's reading guide is generated from the resolved
          # switches, so its central claim -- that the two chimera screens
          # are the only independent pair -- must track them.
          mkdir -p "$T/eo/qc"
          python3 - "$T/eo/qc/evidence_overview_mqc.json" <<'PY' || FAIL=1
          import builtins, json, runpy, sys, types
          class NS(dict):
              def __getattr__(self, k): return self[k]
          out = sys.argv[1]
          ok = True
          cases = [
              (dict(_telocal_enabled=True, _chimera_junction_enabled=True,
                    _chimera_assembly_enabled=True, _two_pass="cohort",
                    _has_condition=True), "Two independent"),
              (dict(_telocal_enabled=False, _chimera_junction_enabled=True,
                    _chimera_assembly_enabled=False, _two_pass="none",
                    _has_condition=False), "One chimera screen"),
              (dict(_telocal_enabled=False, _chimera_junction_enabled=False,
                    _chimera_assembly_enabled=False, _two_pass="per_sample",
                    _has_condition=False), "quantification only"),
          ]
          for params, expected in cases:
              builtins.snakemake = types.SimpleNamespace(
                  params=NS(_sample_count=6, **params), output=[out])
              runpy.run_path("workflow/scripts/evidence_overview_mqc.py", run_name="guard")
              doc = json.load(open(out))
              if "data" not in doc:
                  print("ERROR: custom_content needs a top-level data key"); ok = False
              if expected not in doc["data"]:
                  print(f"ERROR: expected {expected!r} for {params}"); ok = False
          sys.exit(0 if ok else 1)
          PY
          if ! multiqc --force --no-ansi -c workflow/default-config/multiqc_config.yaml \
                -o "$T/eo/out" -n r "$T/eo/qc" > "$T/eo/render.log" 2>&1; then
            echo "ERROR: multiqc failed on the evidence overview section"
            tail -30 "$T/eo/render.log"; FAIL=1
          elif ! grep -q "Start here" "$T/eo/out/r.html"; then
            echo "ERROR: 'Start here' section not rendered"; FAIL=1
          fi

          echo "[guards] 39/42 wildcards are pinned to real sample names"

          # --- Without a {sample} constraint, star_align_pass1's
          # results/star_pass1/{sample}_SJ.out.tab also matches
          # star_merge_junctions' results/star_pass1/merged_SJ.out.tab.
          # Snakemake then tries the per-sample rule with sample="merged",
          # the input function raises KeyError, and it silently recovers --
          # but only in non-strict DAG mode.  Both properties are checked:
          # no recovered stack trace, and a clean run under strict mode.
          if ! snakemake --configfile config/test.yaml -n --cores 1 \
              >"$T/wc.log" 2>&1; then
            echo "ERROR: default dry-run failed"; tail -20 "$T/wc.log"; FAIL=1
          elif grep -q "KeyError: 'merged'" "$T/wc.log"; then
            echo "ERROR: merged_SJ.out.tab still matches the per-sample rule"; FAIL=1
          fi
          if ! snakemake --configfile config/test.yaml -n --cores 1 \
              --strict-dag-evaluation cyclic-graph functions periodic-wildcards \
              >"$T/wc_strict.log" 2>&1; then
            echo "ERROR: dry-run fails under --strict-dag-evaluation"
            tail -20 "$T/wc_strict.log"; FAIL=1
          fi

          echo "[guards] 40/42 strandedness check: declared vs inferred"

          # --- strandedness.check_provided (default true) runs RSeQC on
          # samples that DECLARED a value too, so a sample sheet that
          # disagrees with the data gets flagged.  The declared value must
          # still win for quantification -- reporting a mismatch is the
          # point; silently overriding the user's sheet is not.
          mkdir -p "$T/strand/qc"
          awk -F, 'BEGIN{OFS=","} NR==1{print;next}
            {if($1=="control_rep2") $4="auto"; else $4="forward"; print}' \
            .tests/samples.csv > "$T/strand/mixed.csv"
          sed "s|^samples: .*|samples: $T/strand/mixed.csv|" config/test.yaml \
            > "$T/strand/on.yaml"
          if ! snakemake --configfile "$T/strand/on.yaml" -n --cores 1 -p \
              >"$T/strand/on.log" 2>&1; then
            echo "ERROR: mixed declared/auto dry-run failed"
            tail -20 "$T/strand/on.log"; FAIL=1
          else
            N=$(sed -n '/^Job stats:/,/^$/p' "$T/strand/on.log" \
                | awk '$1=="rseqc_infer_experiment"{print $2; exit}')
            if [ "$N" != "6" ]; then
              echo "ERROR: check_provided should run RSeQC on all 6 samples, got $N"; FAIL=1
            fi
            if ! grep -q "strandedness_check" "$T/strand/on.log"; then
              echo "ERROR: strandedness_check rule not planned"; FAIL=1
            fi
            if ! grep -q -- "--stranded forward" "$T/strand/on.log"; then
              echo "ERROR: declared strandedness did not reach TEcount"; FAIL=1
            fi
          fi
          # ...and check_provided: false runs RSeQC only where it is needed.
          printf '\nstrandedness:\n  min_fraction: 0.6\n  check_provided: false\n' \
            >> "$T/strand/on.yaml"
          if ! snakemake --configfile "$T/strand/on.yaml" -n --cores 1 \
              >"$T/strand/off.log" 2>&1; then
            echo "ERROR: check_provided=false dry-run failed"
            tail -20 "$T/strand/off.log"; FAIL=1
          else
            N=$(sed -n '/^Job stats:/,/^$/p' "$T/strand/off.log" \
                | awk '$1=="rseqc_infer_experiment"{print $2; exit}')
            if [ "$N" != "1" ]; then
              echo "ERROR: check_provided=false should run RSeQC once (the auto sample), got $N"; FAIL=1
            fi
          fi

          # --- the table itself: OK / MISMATCH / auto-detected, and it must
          # render in a real MultiQC run next to the built-in RSeQC plot.
          mkstrand() {
            printf '\n\nThis is PairEnd Data\nFraction of reads failed to determine: %s\nFraction of reads explained by "1++,1--,2+-,2-+": %s\nFraction of reads explained by "1+-,1-+,2++,2--": %s\n' \
              "$2" "$3" "$4" > "$T/strand/qc/$1_infer_experiment.txt"
            printf '%s\n' "$5" > "$T/strand/$1_strandedness.txt"
          }
          mkstrand okS   0.05 0.03 0.92 reverse
          mkstrand badS  0.05 0.03 0.92 reverse
          mkstrand autoS 0.04 0.91 0.05 forward
          python3 - "$T/strand" <<'PY' || FAIL=1
          import builtins, json, runpy, sys, types
          class NS(dict):
              def __getattr__(self, k): return self[k]
          T = sys.argv[1]
          smp = ["okS", "badS", "autoS"]
          out = f"{T}/qc/strandedness_check_mqc.json"
          builtins.snakemake = types.SimpleNamespace(
              params=NS(samples=smp,
                        declared={"okS": "reverse", "badS": "forward", "autoS": "auto"}),
              input=NS(reports=[f"{T}/qc/{s}_infer_experiment.txt" for s in smp],
                       calls=[f"{T}/{s}_strandedness.txt" for s in smp]),
              output=[out])
          runpy.run_path("workflow/scripts/strandedness_check_mqc.py", run_name="guard")
          d = json.load(open(out))
          ok = True
          def check(cond, msg):
              global ok
              if not cond:
                  print("ERROR:", msg); ok = False
          check("data" in d, "custom_content needs a top-level data key")
          rows = d["data"]
          check(rows["okS"]["status"] == "OK", "agreeing sample must be OK")
          check(rows["badS"]["status"] == "MISMATCH", "disagreeing sample must be MISMATCH")
          check(rows["badS"]["used"] == "forward", "MISMATCH must still USE the declared value")
          check(rows["autoS"]["status"] == "auto-detected", "auto sample mislabelled")
          check(rows["autoS"]["used"] == "forward", "auto sample must use the inferred value")
          sys.exit(0 if ok else 1)
          PY
          if ! multiqc --force --no-ansi -c workflow/default-config/multiqc_config.yaml \
              -o "$T/strand/out" -n r "$T/strand/qc" > "$T/strand/render.log" 2>&1; then
            echo "ERROR: multiqc failed on the strandedness check"
            tail -30 "$T/strand/render.log"; FAIL=1
          elif ! grep -q "Strandedness check" "$T/strand/out/r.html"; then
            echo "ERROR: strandedness check table not rendered"; FAIL=1
          elif ! grep -q "MISMATCH" "$T/strand/out/r.html"; then
            echo "ERROR: mismatch not surfaced in the report"; FAIL=1
          elif ! grep -q "Infer experiment" "$T/strand/out/r.html"; then
            echo "ERROR: built-in RSeQC infer_experiment plot missing"; FAIL=1
          fi

          echo "[guards] 41/42 gene_id -> gene_name lookup"

          # --- Every output table is gene_id-keyed, so with an Ensembl or
          # GENCODE GTF none of them carry a readable symbol. The lookup is
          # how a symbol gets onto any of them; it must be complete (one row
          # per gene) and must never leave a blank, or a join silently drops
          # or unlabels rows.
          mkdir -p "$T/gn"
          printf '#!genome-build GRCm38\n' > "$T/gn/ens.gtf"
          printf '1\thavana\tgene\t3073253\t3074322\t.\t+\t.\tgene_id "ENSMUSG00000102693"; gene_name "4933401J01Rik";\n' >> "$T/gn/ens.gtf"
          printf '1\thavana\texon\t3073253\t3074322\t.\t+\t.\tgene_id "ENSMUSG00000102693"; transcript_id "T1"; gene_name "4933401J01Rik";\n' >> "$T/gn/ens.gtf"
          printf '1\tensembl\tgene\t4807788\t4848410\t.\t+\t.\tgene_id "ENSMUSG00000025900"; gene_name "Rp1";\n' >> "$T/gn/ens.gtf"
          # UCSC style: gene_id is already the symbol, no gene_name anywhere
          printf 'chr1\tucsc\texon\t100\t200\t.\t+\t.\tgene_id "Actb"; transcript_id "Actb.1";\n' > "$T/gn/ucsc.gtf"
          python3 - "$T/gn" <<'PY' || FAIL=1
          import builtins, runpy, sys, types
          class NS(dict):
              def __getattr__(self, k): return self[k]
          T = sys.argv[1]
          def run(gtf, out, log):
              builtins.snakemake = types.SimpleNamespace(
                  input=NS(gtf=f"{T}/{gtf}"), output=[f"{T}/{out}"], log=[f"{T}/{log}"])
              runpy.run_path("workflow/scripts/gene_name_lookup.py", run_name="guard")
              import gzip
              rows = [l.rstrip("\n").split("\t") for l in gzip.open(f"{T}/{out}", "rt")]
              return rows[0], dict(rows[1:])
          ok = True
          def check(cond, msg):
              global ok
              if not cond:
                  print("ERROR:", msg); ok = False
          header, m = run("ens.gtf", "ens.tsv.gz", "ens.log")
          check(header == ["gene_id", "gene_name"], f"unexpected header {header}")
          check(len(m) == 2, f"expected 2 genes, got {len(m)}")
          check(m.get("ENSMUSG00000102693") == "4933401J01Rik", "symbol not carried across")
          check(m.get("ENSMUSG00000025900") == "Rp1", "gene-feature-only symbol missed")
          check(all(v for v in m.values()), "a gene_name came out blank")
          header, m = run("ucsc.gtf", "ucsc.tsv.gz", "ucsc.log")
          check(m.get("Actb") == "Actb", "no-gene_name GTF must fall back to gene_id")
          check("WARNING" in open(f"{T}/ucsc.log").read(),
                "a GTF with no gene_name must warn that the lookup is a no-op")
          sys.exit(0 if ok else 1)
          PY

          echo "[guards] 42/42 TElocal chimera index places loci without coords in the key"

          # --- A TElocal cntTable key is
          # transcript_id:gene_id:family_id:class_id and carries NO
          # coordinates unless the TE GTF's transcript_id happens to be a
          # coordinate string (mghlab prebuilt annotations). The index used
          # to parse coordinates out of the key, so on an ordinary rmsk-
          # derived GTF (L1PA2_dupN) EVERY row was skipped, the index came
          # out empty, and telocal_active was "no" for every junction --
          # silently, with no error. Coordinates now come from
          # telocal_locations.bed, and an unplaceable index is fatal.
          mkdir -p "$T/tlx"
          printf 'gene/TE\t/p/x.bam\nLx5b_dup2228:Lx5b:L1:LINE\t42\nMT2B1_dup5641:MT2B1:ERVL:LTR\t7\nENSMUSG00000000001\t900\n' \
            | gzip -c > "$T/tlx/s1.cntTable.gz"
          printf 'chr2\t3000\t3500\tLx5b_dup2228:Lx5b:L1:LINE\t.\t+\nchr2\t9000\t9400\tMT2B1_dup5641:MT2B1:ERVL:LTR\t.\t-\n' \
            > "$T/tlx/loc.bed"
          if ! python3 workflow/scripts/build_chimera_telocal_index.py \
              --telocal-tables "$T/tlx/s1.cntTable.gz" \
              --locations "$T/tlx/loc.bed" --out "$T/tlx/idx.pkl.gz" \
              > "$T/tlx/build.log" 2>&1; then
            echo "ERROR: index build failed"; cat "$T/tlx/build.log"; FAIL=1
          fi
          # ...and with no usable coordinates it must FAIL, not quietly
          # produce an index that makes every locus look unexpressed.
          printf 'chrX\t1\t2\tsomething_else\t.\t+\n' > "$T/tlx/empty.bed"
          if python3 workflow/scripts/build_chimera_telocal_index.py \
              --telocal-tables "$T/tlx/s1.cntTable.gz" \
              --locations "$T/tlx/empty.bed" --out "$T/tlx/bad.pkl.gz" \
              > "$T/tlx/bad.log" 2>&1; then
            echo "ERROR: an unplaceable TElocal index must be fatal"; FAIL=1
          elif ! grep -q "rows could be given genomic coordinates" "$T/tlx/bad.log"; then
            echo "ERROR: wrong message for an unplaceable index"; cat "$T/tlx/bad.log"; FAIL=1
          fi
          python3 - "$T/tlx" <<'PY' || FAIL=1
          import sys
          sys.path.insert(0, "workflow/scripts")
          from chimera_telocal_index import TelocalIndex, classify_telocal, telocal_te_id
          ok = True
          def check(cond, msg):
              global ok
              if not cond:
                  print("ERROR:", msg); ok = False
          idx = TelocalIndex.load(f"{sys.argv[1]}/idx.pkl.gz")
          hits = idx.overlapping("chr2", 3100, 3200)
          check(len(hits) == 1, f"expected 1 overlapping locus, got {len(hits)}")
          check(hits and hits[0][2] == "Lx5b_dup2228:Lx5b:L1:LINE", "wrong locus keyed")
          check(hits and hits[0][5] == 42, "count did not survive the index")
          check(hits and hits[0][3] == "L1", "family must resolve without coords in the key")
          # both key shapes must classify, and gene rows must not
          check(classify_telocal("Lx5b_dup2228:Lx5b:L1:LINE") == ("L1", "LINE"), "dupN key misclassified")
          check(classify_telocal("chr1:5:9(L1PA2:+):L1PA2:L1:LINE") == ("L1", "LINE"), "coord key misclassified")
          check(classify_telocal("ENSMUSG00000000001") == (None, None), "gene row must classify as None")
          # te_id must be the INSERTION, which is what te.bed and the chimera tables use
          check(telocal_te_id("Lx5b_dup2228:Lx5b:L1:LINE") == "Lx5b_dup2228", "te_id must be the insertion")
          check(telocal_te_id("chr1:5:9(L1PA2:+):L1PA2:L1:LINE") == "chr1:5:9(L1PA2:+)", "coord-style te_id wrong")
          sys.exit(0 if ok else 1)
          PY

          echo "[guards] done, FAIL=$FAIL"
          exit $FAIL
