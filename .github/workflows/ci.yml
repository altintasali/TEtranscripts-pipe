name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flowchart:
    # Keeps docs/pipeline-flowchart.md (the full, rule-level Mermaid diagram
    # -- README has a small hand-authored one instead) in sync with the
    # actual rules: the generator is deterministic (rulegraph of the bundled
    # test config), so a diff means the committed diagram is stale. The
    # wiki's copy of this file is a manual refresh, not CI-enforced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tetranscripts-pipe
          environment-file: workflow/environment.yaml
          channel-priority: flexible
      - shell: bash -l {0}
        run: |
          snakemake --configfile config/test.yaml --rulegraph | python workflow/scripts/flowchart.py --update-doc
          git diff --exit-code -- docs/pipeline-flowchart.md

  lint:
    # Static checks only -- no conda env, so this reports in ~20s and catches
    # the cheap class of mistake before the slow jobs run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff (config in pyproject.toml)
        run: ruff check workflow/scripts .tests
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning .tests/guards/*.sh workflow/scripts/*.sh
      - name: guards are executable and parse
        run: |
          for g in .tests/guards/*.sh; do
            [ -x "$g" ] || { echo "not executable: $g"; exit 1; }
            bash -n "$g" || exit 1
          done

  unit:
    # Unit tests over the scripts' pure functions, plus the version-sync
    # check. Seconds, and independent of the conda environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - name: pytest
        run: python -m pytest .tests/unit
      - name: environment.yaml and versions.yaml agree
        run: python .tests/check_version_sync.py
      - name: every rule declares the script it runs
        run: python .tests/check_script_inputs.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tetranscripts-pipe
          environment-file: workflow/environment.yaml
          channel-priority: flexible
      - shell: bash -l {0}
        run: |
          snakemake --configfile config/test.yaml --cores 2

  guards:
    # Behaviour guards: the parse-time startup checks in common.smk, the
    # report's structure, and the scripts' contracts -- including the cases
    # that must FAIL (missing reference / already-trimmed fastqs).
    #
    # The guards live in .tests/guards/, one script each, NOT inline here.
    # They used to be a single ~1,700-line bash block in this file, which
    # meant none could be run locally and a failure meant scrolling a GitHub
    # Actions log. `.tests/guards/run.sh 36` now re-runs one on a laptop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tetranscripts-pipe
          environment-file: workflow/environment.yaml
          channel-priority: flexible
      - shell: bash -l {0}
        run: .tests/guards/run.sh
