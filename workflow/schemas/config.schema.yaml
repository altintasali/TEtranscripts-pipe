$schema: "http://json-schema.org/draft-07/schema#"
description: >-
  Properties of the merged config dict (config/config.yaml +
  config/versions.yaml, deep-merged by Snakemake's multiple `configfile:`
  directives -- see workflow/Snakefile).
type: object

properties:
  samples:
    type: string
  versions:
    type: object
    properties:
      star: {type: string}
      samtools: {type: string}
      trim_galore: {type: string}
      fastqc: {type: string}
      rseqc: {type: string}
      multiqc: {type: string}
      tetranscripts: {type: string}
      deseq2: {type: string}
      ucsc_gtftogenepred: {type: string}
      ucsc_genepredtobed: {type: string}
    required:
      - star
      - samtools
      - trim_galore
      - fastqc
      - rseqc
      - multiqc
      - tetranscripts
      - deseq2
      - ucsc_gtftogenepred
      - ucsc_genepredtobed
  ref:
    type: object
    properties:
      fasta: {type: string}
      gtf: {type: string}
      te_gtf: {type: string}
      sjdb_overhang:
        type: [string, integer]
      decompressed_dir:
        type: string
        description: >-
          Directory where gzipped reference files are decompressed before
          use. Defaults to a directory under /tmp (ephemeral, cheap to
          rebuild); set to a persistent location to avoid re-decompressing
          after every reboot.
    required: [fasta, gtf, te_gtf, sjdb_overhang]
  star:
    type: object
    properties:
      index: {type: string}
      index_extra: {type: string}
      extra: {type: string}
    required: [index]
  trimming:
    type: object
    description: >-
      Optional TrimGalore! adapter/quality trimming before STAR, mirroring
      the nf-core/rnaseq defaults. Set enabled to false to skip trimming
      entirely (STAR then reads the merged/raw fastqs directly).
    properties:
      enabled:
        type: boolean
      trim_nextseq:
        type: integer
        minimum: 0
        description: >-
          --nextseq=N for Trim Galore!: trim based on quality after removing
          poly-G tails. Use for NextSeq/NovaSeq data; set 0 to disable.
      extra:
        type: string
        description: Extra command-line arguments passed verbatim to Trim Galore!.
    required: [enabled]
  strandedness:
    type: object
    description: >-
      Which mode each sample uses is set per-sample in samples.csv (see
      samples.schema.yaml); this section only holds the shared
      auto-detection confidence threshold.
    properties:
      min_fraction:
        type: number
        minimum: 0
        maximum: 1
    required: [min_fraction]
  tetranscripts:
    type: object
    properties:
      mode:
        type: string
        enum: ["multi", "uniq"]
      padj: {type: number}
      foldchange: {type: number}
      minread: {type: integer}
      extra: {type: string}
    required: [mode]

  resources:
    type: object
    description: >-
      Per-rule threads/mem_mb/runtime, loaded from config/resources.yaml.
      Missing rules/keys fall back to conservative defaults in common.smk.
    additionalProperties:
      type: object
      properties:
        threads: {type: integer}
        mem_mb: {type: integer}
        runtime: {type: integer}

required:
  - samples
  - versions
  - ref
  - star
  - trimming
  - strandedness
  - tetranscripts
