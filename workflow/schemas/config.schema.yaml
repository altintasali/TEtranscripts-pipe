$schema: "http://json-schema.org/draft-07/schema#"
description: >-
  Properties of the merged config dict (input/config.yaml +
  input/versions.yaml, deep-merged by Snakemake's multiple `configfile:`
  directives -- see workflow/Snakefile).
type: object
additionalProperties: false

properties:
  samples:
    type: string
  versions:
    type: object
    additionalProperties: false
    properties:
      star: {type: string}
      samtools: {type: string}
      trim_galore: {type: string}
      fastqc: {type: string}
      rseqc: {type: string}
      multiqc: {type: string}
      tetranscripts: {type: string}
      telocal: {type: string}
      stringtie: {type: string}
      deseq2: {type: string}
      ucsc_gtftogenepred: {type: string}
      ucsc_genepredtobed: {type: string}
      r_base: {type: string}
      r_dt: {type: string}
      r_htmlwidgets: {type: string}
      pandoc: {type: string}
    required:
      - star
      - samtools
      - trim_galore
      - fastqc
      - rseqc
      - multiqc
      - tetranscripts
      - deseq2
      - ucsc_gtftogenepred
      - ucsc_genepredtobed
  ref:
    type: object
    additionalProperties: false
    properties:
      fasta: {type: string}
      gtf: {type: string}
      te_gtf: {type: string}
      sjdb_overhang:
        type: [string, integer]
      decompressed_dir:
        type: string
        description: >-
          Directory where gzipped reference files are decompressed before
          use. Defaults to results/pipeline_info/ref_decompressed (shared
          storage; the files are temp()-cleaned after downstream rules
          finish). Must point at shared storage on clusters -- a node-local
          path like /tmp breaks multi-node runs because the snakemake
          scheduler cannot see the compute node's output. When gzipped
          references are present, a node-local or empty value is rejected at
          parse time with a WorkflowError.
    required: [gtf, te_gtf, sjdb_overhang]
  star:
    type: object
    additionalProperties: false
    properties:
      index:
        type: string
        description: >-
          Directory that holds (or will hold) the STAR genome index.
          Optional -- when absent (or empty), the workflow generates one at
          results/star_index. An existing directory is honored as-is; use
          build_index to control whether it is rebuilt.
      build_index:
        type: boolean
        default: true
        description: >-
          Whether the workflow may build a STAR genome index. When true
          (default), the index is built automatically if missing. When false,
          a complete index must already be present at star.index; it is then
          read in place and never written to or deleted (outputs.keep_star_index
          only ever removes an index the workflow built itself). The workflow
          raises an error at startup if the directory is missing or does not
          contain a STAR index.
      index_extra: {type: string}
      extra: {type: string}
      tmpdir:
        type: string
        description: >-
          Directory for STAR's per-run scratch files (the _STARtmp directory;
          roughly one BAM's worth of data). Defaults to the OS temp dir
          (/tmp) so the scratch never clutters results/. Point it at a big/
          fast scratch filesystem on HPC if node-local /tmp is small.
      two_pass:
        type: string
        enum: [none, per_sample, cohort]
        default: cohort
        description: >-
          STAR 2-pass mapping for more sensitive novel-junction detection
          (STAR manual section 9). "none": single-pass, guided only by
          ref.gtf's annotated junctions. "per_sample": STAR's
          --twopassMode Basic -- each sample independently discovers and
          re-aligns against its own novel junctions; no other rules change.
          "cohort" (default FOR NOW, see README): novel junctions are
          pooled across every sample before any sample's final alignment
          (STAR manual's "multi-sample 2-pass" recipe) -- catches junctions
          too weakly supported in any single sample to be caught alone, at
          the cost of a DAG sync point (every sample's pass-1 must finish
          before any sample's final alignment starts) and roughly 2x STAR
          compute.
      two_pass_min_unique_reads:
        type: integer
        minimum: 0
        default: 3
        description: >-
          Only used when two_pass is "cohort". Minimum combined (summed
          across all samples) uniquely-mapping reads a novel junction needs
          to be kept in the pooled junction set fed to every sample's final
          alignment (STAR manual's recommendation to filter out junctions
          "supported by a few reads" before reuse). Annotated junctions
          (already in ref.gtf) are always excluded from pooling -- they are
          already used by every pass via the shared genome index.
  trimming:
    type: object
    additionalProperties: false
    description: >-
      Optional TrimGalore! adapter/quality trimming before STAR, mirroring
      the nf-core/rnaseq defaults. Set enabled to false to skip trimming
      entirely (STAR then reads the merged/raw fastqs directly).
    properties:
      enabled:
        type: boolean
      trim_nextseq:
        type: integer
        minimum: 0
        description: >-
          --nextseq=N for Trim Galore!: trim based on quality after removing
          poly-G tails. Use for NextSeq/NovaSeq data; set 0 to disable.
      extra:
        type: string
        description: Extra command-line arguments passed verbatim to Trim Galore!.
    required: [enabled]
  strandedness:
    type: object
    additionalProperties: false
    description: >-
      Which mode each sample uses is set per-sample in samples.csv (see
      samples.schema.yaml); this section only holds the shared
      auto-detection confidence threshold.
    properties:
      min_fraction:
        type: number
        minimum: 0
        maximum: 1
      check_provided:
        type: boolean
        default: true
        description: >-
          Also run RSeQC on samples whose strandedness is given explicitly in
          samples.csv, so the report can compare what you declared against
          what the data says and flag disagreements. The inferred value is
          only ever reported -- an explicit sample sheet value still wins for
          quantification. Set false to run RSeQC only where it is actually
          needed (samples set to "auto").
    required: [min_fraction]
  tetranscripts:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: ["multi", "uniq"]
      padj: {type: number}
      foldchange: {type: number}
      minread: {type: integer}
      extra: {type: string}
      qc:
        type: object
        additionalProperties: false
        description: >-
          Sample-QC view (PCA + sample clustering) of the per-sample TEcount
          tables, rendered inside multiqc_report.html. On by default; set
          enabled to false to skip it entirely. Filters apply to the QC-view
          counts matrix only -- the per-sample cntTables are never reduced.
        properties:
          enabled:
            type: boolean
          min_samples_present:
            type: integer
            minimum: 1
          min_total_counts:
            type: integer
            minimum: 1
          min_events:
            type: integer
            minimum: 1
          pca_transform:
            type: string
            enum: ["vst", "rlog", "log2"]
          feature_class:
            type: string
            enum: ["TE", "gene", "all"]
            description: >-
              Which features the QC-view counts matrix keeps: TE (TE subfamily
              names only, the default), gene (gene ids only), or all (genes +
              TEs, exactly what TEcount reports).
        required: [enabled, min_samples_present, min_total_counts, min_events,
                   pca_transform, feature_class]
    required: [mode]

  chimera:
    type: object
    additionalProperties: false
    description: >-
      Gene-TE chimera detection via two complementary, independent methods
      -- reads (STAR split-read evidence) and assembly (StringTie
      transcript-structure evidence). See each sub-block. EXPERIMENTAL:
      classification and QC-view behavior may still change between
      releases.
    properties:
      reads:
        type: object
        additionalProperties: false
        description: >-
          Gene-TE chimera screen from STAR's chimeric-junction reads (STAR
          --chimOutType Junctions WithinBAM SoftClip), per-junction
          annotation, count matrix, and sample-QC (PCA / sample
          clustering). Enabled by default; set enabled to false to opt out
          -- the workflow then behaves like a plain quantification
          pipeline. Only sees reads STAR can't explain as one linear
          alignment -- an ordinary, canonical-intron TE-initiated splice
          will not appear here; see chimera.assembly for that case.
        properties:
          enabled:
            type: boolean
            description: >-
              When true (default), the STAR alignment emits chimeric junctions
              and the chimera screen runs on the same alignment as TEcount. When
              false, the chimera STAR flags, rules and outputs are absent and
              the workflow behaves exactly like the plain quantification
              pipeline.
          star:
            type: object
            additionalProperties: false
            description: STAR chimeric-junction detection parameters.
            properties:
              segment_min: {type: integer}
              overhang_min: {type: integer}
              score_drop_max: {type: integer}
              extra:
                type: string
                description: Extra verbatim STAR chimeric-alignment flags.
            required: [segment_min, overhang_min, score_drop_max]
          breakpoint_tolerance:
            type: integer
            minimum: 0
            description: >-
              Slack (bp) allowed when matching a STAR chimeric breakpoint to an
              exon/TE feature edge (annotation coordinate conventions can shift
              breakpoints by a base or two).
          require_canonical_junction:
            type: boolean
            description: >-
              Whether to require STAR junction type 1 (GT/AG) for a junction to be
              classified as gene-TE. TE-involved splicing is often non-canonical,
              so the default (false) keeps everything and records the type.
          qc:
            type: object
            additionalProperties: false
            description: >-
              Filters applied to the chimera count matrix *for the PCA/clustering
              view only* -- they never remove events from all_events.tsv or the
              counts matrix.
            properties:
              min_samples_present:
                type: integer
                minimum: 1
              min_total_counts:
                type: integer
                minimum: 1
              min_events:
                type: integer
                minimum: 1
              pca_transform:
                type: string
                enum: ["vst", "rlog", "log2"]
            required: [min_samples_present, min_total_counts, min_events, pca_transform]
          outputs:
            type: object
            additionalProperties: false
            description: Which chimera artifacts to write.
            properties:
              write_igv_bed:
                type: boolean
              write_counts_matrix:
                type: boolean
            required: [write_igv_bed, write_counts_matrix]
        required: [enabled, star, breakpoint_tolerance, require_canonical_junction,
                   qc, outputs]
      assembly:
        type: object
        additionalProperties: false
        description: >-
          Gene-TE chimera detection from StringTie assembly structure
          instead of read-level chimeric junctions -- catches TE-initiated/
          exonized/terminated transcripts spliced via an ordinary,
          canonical intron, which chimera.reads structurally cannot see.
          Complements chimera.reads (a candidate found by both is
          cross-referenced, see results/chimera/assembly/). Uses a
          separate, dedicated STAR alignment pass (--outSAMstrandField
          intronMotif, for StringTie's strand inference on unstranded
          data) -- this suppresses non-canonical-junction reads from that
          one private BAM only; the main alignment used by everything else
          is untouched. Disabled by default: newer and less validated than
          chimera.reads.
        properties:
          enabled:
            type: boolean
            description: >-
              When true, runs the StringTie-assembly chimera screen
              (stringtie_assemble/merge/requantify + classify/quantify/
              cross_evidence). Default false.
          breakpoint_tolerance:
            type: integer
            minimum: 0
            description: >-
              Slack (bp) allowed when matching an assembled transcript's
              first/internal/last exon to a TE or gene-exon feature edge.
              StringTie's assembled exon boundaries (especially the first
              exon's 5' end, which has no upstream junction to anchor it)
              are coverage-inferred and can be imprecise at low depth --
              worth setting more generous than chimera.reads's default
              for single-end data.
          min_transcript_tpm:
            type: number
            minimum: 0
            description: >-
              Not applied at detection time (candidates are always fully
              reported, same annotate-first philosophy as chimera.reads)
              -- this is the threshold the report/README examples use when
              reading results/chimera/assembly/tpm_matrix.tsv.gz. No rule
              currently filters on it automatically.
          outputs:
            type: object
            additionalProperties: false
            description: Which chimera-assembly artifacts to write.
            properties:
              write_igv_bed:
                type: boolean
                description: >-
                  Write a BED track (results/chimera/assembly/igv/
                  candidates.bed) spanning each candidate's TE-overlapping
                  exon, colored by chimera_type, for loading alongside
                  chimera.reads's own IGV track. Default false.
            required: [write_igv_bed]
        required: [enabled, breakpoint_tolerance, min_transcript_tpm, outputs]
    required: [reads, assembly]

  telocal:
    type: object
    additionalProperties: false
    description: >-
      Locus-level TE quantification (TElocal), complementing TEcount's
      subfamily-level quantification. Enabled by default; requires a
      pre-built .locInd file. Set enabled to false to skip.
    properties:
      enabled:
        type: boolean
        description: >-
          When true, TElocal runs on each sample's BAM and produces
          per-sample locus-level TE count tables. When false, the telocal
          rules are not included.
      locind:
        type: string
        description: >-
          Path to a pre-built TElocal .locInd file (built from the same TE
          GTF via TElocal_indexer). Required when enabled is true. When
          empty, the workflow auto-builds the index from the TE GTF into
          results/telocal/telocal.locInd, using the method set by
          telocal.indexer.
      indexer:
        type: string
        enum: ["fast", "legacy"]
        default: fast
        description: >-
          Only used when locind is empty (auto-build). "fast" (default):
          our reimplementation of TElocal_Toolkit's TEfeatures.build() --
          same tree-insertion logic, unmodified, but fixes an O(n^2)
          bottleneck in the surrounding per-line loop (a list-membership
          check that should have been a set). Verified against the
          original on real mouse rmsk data (3.7M TE instances): identical
          output, 0 mismatches across 50,000+ spatial queries, ~1000x
          faster (a 21h build dropped to ~1 minute). "legacy": TElocal's
          own unmodified TEfeatures.build() -- an escape hatch, since
          "fast" relies on that library's internal attributes at the
          pinned version rather than its public API.
      extra:
        type: string
        description: Extra command-line arguments passed verbatim to TElocal.
      qc:
        type: object
        additionalProperties: false
        description: >-
          Sample-QC view (PCA + sample clustering) of the per-sample TElocal
          tables, rendered inside multiqc_report.html. Mirrors
          tetranscripts.qc and shares its sample_qc.R machinery. On by
          default; set enabled to false to skip it entirely. Filters apply to
          the QC-view counts matrix only -- the per-sample cntTables are
          never reduced.
        properties:
          enabled:
            type: boolean
          min_samples_present:
            type: integer
            minimum: 1
          min_total_counts:
            type: integer
            minimum: 1
          min_events:
            type: integer
            minimum: 1
          pca_transform:
            type: string
            enum: ["vst", "rlog", "log2"]
            description: >-
              Defaults to log2: locus-level matrices hold one row per TE
              instance (often millions), which makes vst/rlog prohibitively
              slow.
          feature_class:
            type: string
            enum: ["TE", "gene", "all"]
            description: >-
              Which features the QC-view counts matrix keeps: TE (TE loci
              only, the default), gene (gene ids only), or all (genes +
              loci, exactly what the TElocal cntTables report).
        required: [enabled, min_samples_present, min_total_counts, min_events,
                   pca_transform, feature_class]
    required: [enabled]

  resources:
    type: object
    description: >-
      Per-rule threads/mem_mb/runtime, loaded from input/resources.yaml.
      Missing rules/keys fall back to conservative defaults in common.smk.
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        threads: {type: integer}
        mem_mb: {type: integer}
        runtime: {type: integer}
        mem_per_sample:
          type: integer
          description: >-
            Extra mem_mb per sample, for rules that hold per-sample data in
            memory. common.smk's get_scaled_mem_mb() allocates
            mem_mb + mem_per_sample * len(SAMPLES).

  outputs:
    type: object
    additionalProperties: false
    description: >-
      Whether intermediate fastq files are kept after the downstream rules
      that consume them finish. Setting either to false marks those files as
      Snakemake temp() outputs -- deleted automatically after the last
      consumer (alignment) runs -- saving disk on big runs. Both default to
      true.
    properties:
      keep_merged_fastq:
        type: boolean
        description: >-
          Keep the lane-concatenated fastqs (results/fastq/). Note: only
          meaningful while trimming is enabled -- otherwise STAR reads them
          directly, so deleting them forces a full re-alignment on the next
          run.
      keep_trimmed_fastq:
        type: boolean
        description: Keep the TrimGalore!-trimmed fastqs (results/trimming/).
      keep_star_index:
        type: boolean
        description: >-
          Keep the STAR genome index in results/star_index/ after alignment.
          false deletes it (rm -rf) once all samples are aligned, saving disk
          at the cost of re-copying (or rebuilding) on the next run.
      keep_telocal_index:
        type: boolean
        description: >-
          Keep the auto-built TElocal .locInd index
          (results/telocal/telocal.locInd) after all samples' TElocal runs
          finish.
          false deletes it once quantification is done, saving disk at the
          cost of re-building on the next run. Never applies to a
          user-provided telocal.locind path.

required:
  - samples
  - versions
  - ref
  - star
  - trimming
  - strandedness
  - tetranscripts
