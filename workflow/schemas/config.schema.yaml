$schema: "http://json-schema.org/draft-07/schema#"
description: >-
  Properties of the merged config dict (config/config.yaml +
  config/versions.yaml, deep-merged by Snakemake's multiple `configfile:`
  directives -- see workflow/Snakefile).
type: object

properties:
  samples:
    type: string
  versions:
    type: object
    properties:
      star: {type: string}
      samtools: {type: string}
      rseqc: {type: string}
      multiqc: {type: string}
      tetranscripts: {type: string}
      deseq2: {type: string}
      ucsc_gtftogenepred: {type: string}
      ucsc_genepredtobed: {type: string}
    required:
      - star
      - samtools
      - rseqc
      - multiqc
      - tetranscripts
      - deseq2
      - ucsc_gtftogenepred
      - ucsc_genepredtobed
  ref:
    type: object
    properties:
      fasta: {type: string}
      gtf: {type: string}
      te_gtf: {type: string}
      sjdb_overhang:
        type: [string, integer]
    required: [fasta, gtf, te_gtf, sjdb_overhang]
  star:
    type: object
    properties:
      index: {type: string}
      extra: {type: string}
    required: [index]
  strandedness:
    type: object
    description: >-
      Which mode each sample uses is set per-sample in samples.csv (see
      samples.schema.yaml); this section only holds the shared
      auto-detection confidence threshold.
    properties:
      min_fraction:
        type: number
        minimum: 0
        maximum: 1
    required: [min_fraction]
  tetranscripts:
    type: object
    properties:
      mode:
        type: string
        enum: ["multi", "uniq"]
      padj: {type: number}
      foldchange: {type: number}
      minread: {type: integer}
      extra: {type: string}
    required: [mode]

  resources:
    type: object
    description: >-
      Per-rule threads/mem_mb/runtime, loaded from config/resources.yaml.
      Missing rules/keys fall back to conservative defaults in common.smk.
    additionalProperties:
      type: object
      properties:
        threads: {type: integer}
        mem_mb: {type: integer}
        runtime: {type: integer}

required:
  - samples
  - versions
  - ref
  - star
  - strandedness
  - tetranscripts
