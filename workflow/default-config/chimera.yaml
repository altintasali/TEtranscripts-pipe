# =============================================================================
# BUILT-IN DEFAULT chimera-detection settings -- part of the workflow itself,
# loaded automatically (see workflow/Snakefile). You should NOT normally need
# to edit this file; copy the `chimera:` section from config/config.example.yaml
# into input/config.yaml and change what you need there instead.
#
# Two independent, complementary detection methods live under chimera.*:
#   chimera.junction -- STAR chimeric-junction reads (on by default). Only
#     sees reads STAR can't explain as one linear alignment.
#   chimera.assembly -- StringTie assembly structure (also on by default;
#     newer and less validated than chimera.junction). Catches
#     ordinary-canonical-intron TE-initiated splices that chimera.junction
#     structurally cannot see. Costs a second, dedicated STAR pass per
#     sample -- set enabled: false if you don't need it.
# A candidate found by both is cross-referenced -- see
# results/chimera/transcript_evidence/transcripts_with_read_support.tsv.gz.
#
# EXPERIMENTAL: both stages are newer additions to the pipeline -- their
# classification and QC-view behavior may still change between releases. Use
# for exploration, and validate the output before relying on it for published
# results.
# =============================================================================
chimera:
  junction:
    enabled: true
    star:
      segment_min: 12
      overhang_min: 12
      score_drop_max: 20
      extra: ""
    breakpoint_tolerance: 0
    require_canonical_junction: false
    qc:
      min_samples_present: 2
      min_total_counts: 5
      min_events: 10
      pca_transform: vst
    outputs:
      write_igv_bed: false
      write_counts_matrix: true
  assembly:
    enabled: true
    breakpoint_tolerance: 5
    min_transcript_tpm: 1
    outputs:
      write_igv_bed: false
