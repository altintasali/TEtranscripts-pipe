# =============================================================================
# Custom MultiQC configuration, passed to every multiqc run via `-c`.
#
# The key setting is extra_fn_clean_exts: TrimGalore! names its trimmed/fastqc
# files {sample}_val_{1,2}_... / {sample}_trimmed_... (see trimming.smk), and
# without cleaning those suffixes MultiQC would derive FastQC sample names
# like "control_rep1_val_1" -- which no longer matches the "control_rep1" rows
# from STAR/RSeQC, so the General Stats table would gain extra, mostly-empty
# rows per sample. Trimming the suffixes makes every module's rows merge into
# one clean row per sample.
# =============================================================================
title: "TEtranscripts-pipe"
comment: >-
  Auto-generated by the TEtranscripts-pipe Snakemake workflow
  (STAR alignment, RSeQC strandedness, TEtranscripts/TEcount quantification,
  and the optional chimera gene-TE junction screen).

extra_fn_clean_exts:
  - "_val_1"
  - "_val_2"
  - "_trimmed"

# Order report sections by the analysis flow: raw QC -> trimming -> alignment
# -> strandedness -> quantification/versions. FastQC appears twice (raw input
# and, when trimming is enabled, the TrimGalore!-run reports), disambiguated
# by path_filters on the output directories. The resource-usage summary
# (custom content emitted by the benchmark_summary rule, qc.smk) closes the
# report. When the chimera stage is enabled, its sample-QC sections (ids
# chimera_sample_qc_pca / chimera_sample_qc_heatmap, emitted by the sample_qc
# rule) render inside the custom_content module (ordered below).
module_order:
  - fastqc:
      name: "FastQC (raw input)"
      path_filters:
        - "**/fastqc/raw/**"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters:
        - "**/trimming/**"
  - star
  - rseqc
  - custom_content

# Order of the custom-content sections within the custom_content module;
# without this their order is arbitrary. Section ids come from the `_mqc.json`
# documents emitted by the sample_qc (chimera screen, only when enabled) and
# benchmark_summary rules. MultiQC silently skips ids that produced no data,
# so the chimera ids are harmless when the chimera stage is off.
custom_content:
  order:
    - chimera_sample_qc_pca
    - chimera_sample_qc_heatmap
    - resource_usage
