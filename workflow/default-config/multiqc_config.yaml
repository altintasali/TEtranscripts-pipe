# =============================================================================
# Custom MultiQC configuration, passed to every multiqc run via `-c`.
# Declared as an INPUT of the multiqc rule (see common.smk MULTIQC_CONFIG),
# so editing this file rebuilds the report.
# =============================================================================

# Software Versions comes from ONE source: the curated
# results/versions/rnaseq_mqc_versions.yml that software_versions.smk writes
# from the pinned versions in versions.yaml. MultiQC otherwise ALSO
# auto-detects versions from module output and groups them BY MODULE, which
# listed FastQC three times -- "FastQC (raw input)" and "FastQC (trimmed)"
# from the two renamed fastqc instances in module_order below, plus the real
# curated entry under "Trimming & QC".
#
# This also drops the auto-detected Cutadapt row. Cutadapt is not pinned by
# this pipeline (it arrives as a TrimGalore! dependency), so its version was
# only ever knowable by detection; pin it in versions.yaml +
# environment.yaml to put it back deliberately.
disable_version_detection: true

# Files MultiQC must not open.
# ----------------------------
# The search directories are results/* subtrees that also hold the pipeline's
# actual data: trimmed FASTQs, BAMs, gzipped counts matrices, cntTables, and
# every per-rule log. MultiQC cannot parse any of those but still walks into
# them, and on a real run the search phase stalled long enough to look like a
# hang. Excluding them can only lose files MultiQC was never going to read.
#
# Deliberately NOT excluded: results/pipeline_info itself, which holds the
# *_mqc.json custom content (benchmark_summary, config_used,
# evidence_overview); only its logs/ and benchmarks/ subtrees are skipped.
# The benchmark files are already aggregated into benchmark_summary_mqc.json.
#
# Note the missing trailing "/*": MultiQC matches fn_ignore_paths against the
# DIRECTORY path, so "*/pipeline_info/logs/*" silently never fires while
# "*/pipeline_info/logs" does. Both forms were measured -- see the guard.
fn_ignore_paths:
  - "*/pipeline_info/logs"
  - "*/pipeline_info/benchmarks"
fn_ignore_files:
  - "*.bam"
  - "*.bai"
  - "*.fq.gz"
  - "*.fastq.gz"
  - "*_counts.tsv"
  - "*_counts.tsv.gz"
  - "*.cntTable"
  - "*.cntTable.gz"

title: "TEtranscripts-pipe"
comment: >-
  Auto-generated by the TEtranscripts-pipe Snakemake workflow
  (STAR alignment, RSeQC strandedness, TEtranscripts/TEcount quantification,
  TElocal locus-level TE quantification, and the two gene-TE chimera screens).

extra_fn_clean_exts:
  - "_val_1"
  - "_val_2"
  - "_trimmed"
  - "_R1"
  - "_R2"
  # samtools flagstat writes {sample}_flagstat.txt; without this MultiQC
  # derives "{sample}_flagstat" and the mapped-read counts land in their own
  # General Statistics row instead of the sample's.
  - "_flagstat"

# Order report sections by the analysis flow: raw QC -> trimming -> alignment
# -> strandedness -> quantification/versions. FastQC appears twice (raw input
# and, when trimming is enabled, the TrimGalore!-run reports), disambiguated
# by path_filters on the output directories. Samtools (flagstat) sits right
# after STAR since it's a read-flag breakdown of the same alignment; RSeQC
# auto-detects infer_experiment/read_distribution/geneBody_coverage outputs
# into its own subsections, no per-tool module_order entry needed. The
# custom-content module holds all quantification/chimera sections (ordered
# below); the resource-usage summary and software versions close the report.
module_order:
  - fastqc:
      name: "FastQC (raw input)"
      path_filters:
        - "**/fastqc/raw/**"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters:
        - "**/trimming/**"
  - star
  - samtools
  - rseqc
  # Each custom-content parent_id is registered as its own MultiqcModule
  # (multiqc/core/special_case_modules/custom_content.py), so a group id is
  # valid here and can be interleaved with the built-in modules. The
  # strandedness check reads RSeQC's own infer_experiment output, so it
  # belongs beside RSeQC rather than adrift among the quantification
  # sections.
  - strandedness_check
  - custom_content

# Order of the custom-content groups within the custom_content module.
# Each id below is a parent group (the parent_id on the emitted `_mqc.json`
# documents) rendered as one collapsible report section.
#
# ORDERING PRINCIPLE: how to read the evidence first, then whether that
# evidence is independent, then what each screen contributed. The report
# previously opened each screen with its own ranked candidate table -- three
# rankings on three different keys, so a reader's candidate list depended on
# where they scrolled. All three are gone: the pipeline reports evidence and
# does not rank candidates, because no weighting of these signals has been
# validated here (see chimera_evidence_guide_mqc.py). Nothing in the report
# may render a candidate table; guard 37 asserts it.
#
#   evidence_overview    "Start here": which evidence layers this run
#                        produced and which are independent.
#   tecount / telocal    Expression. NOTE: these ids must match sample_qc.R's
#                        view ids exactly (a mismatch silently splits a group).
#   chimera_evidence_guide  Gene-TE chimeras: reading the evidence
#                        What each line of evidence is worth and what has
#                        been measured about it, plus the cohort's evidence
#                        composition. No candidate table: the catalogue is
#                        results/chimera/candidates.tsv.gz. Emitted by
#                        chimera_evidence_guide_mqc.py.
#   chimera_structure    How independent is this evidence?
#                        The two evidence heatmaps -- where a reader checks
#                        the guide's claims against their own cohort. Its own
#                        group, not a sub-item of either screen: it reads the
#                        merged table, so filing it under one screen made a
#                        cross-screen check look like that screen's own
#                        diagnostic. Emitted by chimera_evidence_heatmap.py.
#
# NAMING: the two screens below are named for the EVIDENCE they use, not for
# their internals -- "chimera"/"junction" previously appeared across four
# section names with nothing saying what distinguished them:
#
#   chimera_reads        Evidence: chimeric reads
#                        STAR chimeric reads. Views: what this screen sees
#                        (blind spot + qualifying counts), events +
#                        splice-motif rate by direction, the gene-TE subset,
#                        and PCA/Clusters. Emitted by junction_qc_mqc,
#                        junction_highlights_mqc and sample_qc.R -- ALL of
#                        which must use this exact id, or the group silently
#                        splits into two sections.
#   chimera_transcripts  Evidence: assembled transcripts
#                        StringTie assembly. A genuinely different screen
#                        with opposite blind spots, so it stays separate.
#
#   evidence_status      Per-sample traffic-light grid. Sits after the screens
#                        it summarises -- its columns are all screen layers.
#   config_used          resolved run configuration.
#   resource_usage       per-rule benchmark summary.
#
# strandedness_check is NOT listed here: it is placed next to rseqc via
# module_order above. MultiQC silently skips ids that produced no data, so
# entries are harmless when the corresponding stage is off.
custom_content:
  order:
    - evidence_overview
    - tecount
    - telocal
    - chimera_evidence_guide
    - chimera_structure
    - chimera_reads
    - chimera_transcripts
    - evidence_status
    - config_used
    - resource_usage

# Sections within a group are sorted BY NAME by default
# (custom_content.py, end of the module), which would bury the reading guide
# in the middle of its group. Force it first in both screens.
# Sections within a group sort BY NAME by default (custom_content.py, end of
# the module), which scattered the reading order alphabetically -- the guide
# landed mid-group and the quality checks came after the raw composition.
# Explicit order here; lower renders earlier. Sample-QC PCA/Clusters are left
# to the default so they trail as supporting material.
report_section_order:
  # Reading the evidence -- the guide first, then what this cohort produced.
  chimera_evidence_guide:
    order: -10
  chimera_evidence_composition:
    order: -9
  # How independent is this evidence -- structure behind the guide's claims.
  chimera_evidence_correlation:
    order: -10
  chimera_evidence_candidates:
    order: -9
  # Evidence: chimeric reads -- what the screen sees, then composition, then
  # quality, then the gene-TE subset. Sample-QC PCA/Clusters are left to the
  # default sort so they trail as supporting material.
  junction_highlights:
    order: -10
  chimera_junction_qc:
    order: -9
  chimera_canonical_rate:
    order: -8
  chimera_te_gene_chimeras:
    order: -7
  # Evidence: assembled transcripts
  chimera_assembly_highlights:
    order: -10
  chimera_assembly_classes:
    order: -9
  # Module-level move: report_section_order's FIRST pass reorders whole
  # modules by anchor, and a custom-content group's anchor is its parent_id.
  # module_order alone does not do this -- a group absent from
  # custom_content.order is appended after the ones listed there, whatever
  # module_order says.
  #
  # "before: rseqc" really does render it AFTER RSeQC. The ordering pass
  # indexes reversed(report.modules) and reverses again at the end
  # (order_modules_and_sections.py), so the two keys come out inverted at
  # module level. Measured both ways -- "after: rseqc" put it above RSeQC.
  strandedness_check:
    before: rseqc
