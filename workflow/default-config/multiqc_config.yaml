# =============================================================================
# Custom MultiQC configuration, passed to every multiqc run via `-c`.
#
# The key setting is extra_fn_clean_exts: TrimGalore! names its trimmed/fastqc
# files {sample}_val_{1,2}_... / {sample}_trimmed_... (see trimming.smk), and
# raw FastQC zips carry the read suffix {sample}_R{read}_fastqc.zip.  Without
# cleaning those suffixes MultiQC would derive FastQC sample names like
# "control_rep1_val_1" or "control_rep1_R1" -- which no longer match the
# "control_rep1" rows from STAR/RSeQC, so the General Stats table would gain
# extra, mostly-empty rows per sample.  Trimming the suffixes makes every
# module's rows merge into one clean row per sample.
# =============================================================================
title: "TEtranscripts-pipe"
comment: >-
  Auto-generated by the TEtranscripts-pipe Snakemake workflow
  (STAR alignment, RSeQC strandedness, TEtranscripts/TEcount quantification,
  TElocal locus-level TE quantification, and the gene-TE chimera junction screen).

extra_fn_clean_exts:
  - "_val_1"
  - "_val_2"
  - "_trimmed"
  - "_R1"
  - "_R2"

# Order report sections by the analysis flow: raw QC -> trimming -> alignment
# -> strandedness -> quantification/versions. FastQC appears twice (raw input
# and, when trimming is enabled, the TrimGalore!-run reports), disambiguated
# by path_filters on the output directories. The resource-usage summary
# (custom content emitted by the benchmark_summary rule, qc.smk) closes the
# report. When the chimera stage and/or the TEcounts sample-QC stage is
# enabled, their sample-QC sections (ids chimera_sample_qc_pca /
# chimera_sample_qc_heatmap, tecount_sample_qc_pca / tecount_sample_qc_heatmap,
# emitted by the sample_qc / tecount_qc rules) render inside the
# custom_content module (ordered below).
module_order:
  - fastqc:
      name: "FastQC (raw input)"
      path_filters:
        - "**/fastqc/raw/**"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters:
        - "**/trimming/**"
  - star
  - rseqc
  - custom_content

# Order of the custom-content sections within the custom_content module;
# without this their order is arbitrary. Section ids come from the `_mqc.json`
# documents emitted by the sample_qc (chimera screen, only when enabled),
# tecount_qc (TEcounts sample-QC, enabled by default), telocal_summary
# (TElocal locus-level TE assignment + TE-class barplots, enabled by default),
# junction_qc_barplot
# (chimera junction-QC + TE-chimeras barplots, only when the chimera stage is
# enabled), tecount_summary (per-sample TEcounts assignment + TE-class
# barplots) and benchmark_summary rules. Ordered by the analysis flow --
# TEcounts quantification (primary output) first, then TElocal, then the
# downstream chimera screen, closing with the TE-chimeras view and the
# resource-usage table.
# MultiQC silently skips ids that produced no data, so the ids are harmless
# when the corresponding stage is off.
custom_content:
  order:
    - tecounts
    - telocal
    - chimera
    - config_used
    - resource_usage
