# =============================================================================
# Custom MultiQC configuration, passed to every multiqc run via `-c`.
#
# The key setting is # Software Versions comes from ONE source: the curated
# results/versions/rnaseq_mqc_versions.yml that software_versions.smk writes
# from the pinned versions in versions.yaml. MultiQC otherwise also
# auto-detects versions from module output and groups them BY MODULE, which
# duplicated FastQC into three rows -- "FastQC (raw input)" and "FastQC
# (trimmed)" from the two renamed fastqc instances in module_order below,
# plus the real curated entry under "Trimming & QC".
#
# Note this also drops the auto-detected Cutadapt row. Cutadapt is not pinned
# by this pipeline (it arrives as a TrimGalore! dependency), so its version
# was only ever knowable by detection; pin it in versions.yaml +
# environment.yaml if you want it back in the table.
disable_version_detection: true

# Files MultiQC must not open.
# ----------------------------
# The search directories are results/* subtrees that also hold the pipeline's
# actual data: trimmed FASTQs, BAMs, gzipped counts matrices, and every
# per-rule log. MultiQC cannot parse any of those, but it still walks into
# them, and on a real run the search phase stalled long enough to look like a
# hang (the log lists the search paths and then sits there before any module
# reports). Excluding them can only lose things MultiQC was never going to
# read.
#
# Deliberately NOT excluded: results/pipeline_info itself, which holds the
# *_mqc.json custom content (benchmark_summary, config_used,
# evidence_overview); only its logs/ and benchmarks/ subtrees are skipped.
# The benchmark files are already aggregated into benchmark_summary_mqc.json
# by the benchmark_summary rule, so nothing is lost by not re-walking them.
# Note the missing trailing "/*": MultiQC matches fn_ignore_paths against the
# DIRECTORY path, so "*/pipeline_info/logs/*" silently never fires while
# "*/pipeline_info/logs" does. Verified both ways -- see the guard.
fn_ignore_paths:
  - "*/pipeline_info/logs"
  - "*/pipeline_info/benchmarks"
fn_ignore_files:
  - "*.bam"
  - "*.bai"
  - "*.fq.gz"
  - "*.fastq.gz"
  - "*_counts.tsv"
  - "*_counts.tsv.gz"
  - "*.cntTable"
  - "*.cntTable.gz"

extra_fn_clean_exts: TrimGalore! names its trimmed/fastqc
# files {sample}_val_{1,2}_... / {sample}_trimmed_... (see trimming.smk), and
# raw FastQC zips carry the read suffix {sample}_R{read}_fastqc.zip.  Without
# cleaning those suffixes MultiQC would derive FastQC sample names like
# "control_rep1_val_1" or "control_rep1_R1" -- which no longer match the
# "control_rep1" rows from STAR/RSeQC, so the General Stats table would gain
# extra, mostly-empty rows per sample.  Trimming the suffixes makes every
# module's rows merge into one clean row per sample.
# =============================================================================
title: "TEtranscripts-pipe"
comment: >-
  Auto-generated by the TEtranscripts-pipe Snakemake workflow
  (STAR alignment, RSeQC strandedness, TEtranscripts/TEcount quantification,
  TElocal locus-level TE quantification, and the gene-TE chimera junction screen).

extra_fn_clean_exts:
  - "_val_1"
  - "_val_2"
  - "_trimmed"
  - "_R1"
  - "_R2"

# Order report sections by the analysis flow: raw QC -> trimming -> alignment
# -> strandedness -> quantification/versions. FastQC appears twice (raw input
# and, when trimming is enabled, the TrimGalore!-run reports), disambiguated
# by path_filters on the output directories. Samtools (flagstat) sits right
# after STAR since it's a read-flag breakdown of the same alignment; RSeQC
# auto-detects infer_experiment/read_distribution/geneBody_coverage outputs
# into its own subsections, no per-tool module_order entry needed. The
# custom-content module holds all quantification/chimera sections (ordered
# below); the resource-usage summary and software versions close the report.
module_order:
  - fastqc:
      name: "FastQC (raw input)"
      path_filters:
        - "**/fastqc/raw/**"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters:
        - "**/trimming/**"
  - star
  - samtools
  - rseqc
  - custom_content

# Order of the custom-content groups within the custom_content module;
# without this their order is arbitrary. Each id below is a parent group
# (parent_id on the emitted `_mqc.json` documents) rendered as one
# collapsible report section:
#   evidence_overview  "Start here": which evidence layers this run
#                produced and which are independent (evidence_overview rule).
#                Deliberately FIRST -- it is the report's reading guide.
#   strandedness_check  declared vs. RSeQC-inferred strandedness per
#                sample, mismatches flagged (strandedness_check rule).
#                Sits right after the guide: a wrong strandedness invalidates
#                every number below it, so it is checked before they are read.
#   evidence_status  FastQC-style per-sample status grid: which evidence
#                layers each sample contributed to (sample_evidence_status)
#   tecount      TEcount: assignment + TE-class barplots, PCA, Clusters
#                (tecount_summary / tecount_qc rules)
#                NOTE: must match sample_qc.R's tecount view id exactly --
#                a mismatch splits the group into two report sections.
#   telocal      TElocal: same section set (telocal_summary / telocal_qc)
#   chimera      Chimera (junction): a "what to look at" guide with this
#                run's top-ranked gene-TE junctions, the Junction QC and
#                canonical-rate barplots, PCA + Clusters
#                (junction_highlights / junction_qc_barplot / sample_qc rules)
#   te_gene_chimeras  Gene-TE chimeras: gene<->TE junction subset view
#                (junction_qc_barplot rule)
#   chimera_evidence  Chimera evidence: dimension-vs-dimension correlation
#                and the per-dimension leaders, both as heatmaps and with no
#                combined score (chimera_evidence_heatmap rule)
#   chimera_assembly  Chimera (assembly): candidates-by-class barplot + a
#                "what to look at" guide with this run's top candidates
#                (chimera_assembly_summary_mqc rule; off by default, config
#                chimera.assembly.enabled)
#   config_used  resolved run configuration (config_used rule)
# Order below reads: guide -> expression -> chimera evidence -> run record.
# The built-in QC modules (FastQC/STAR/samtools/RSeQC) come before all of
# this via module_order above.
#   resource_usage  per-rule benchmark summary (benchmark_summary rule)
# MultiQC silently skips ids that produced no data, so the ids are harmless
# when the corresponding stage is off.
custom_content:
  order:
    - evidence_overview
    - strandedness_check
    - evidence_status
    - tecount
    - telocal
    - chimera
    - te_gene_chimeras
    - chimera_evidence
    - chimera_assembly
    - config_used
    - resource_usage
