# =============================================================================
# BUILT-IN DEFAULT per-rule compute resources -- threads (CPUs), memory
# (MB), and runtime (minutes). Part of the workflow itself, loaded
# automatically. You should NOT normally need to edit this file.
#
# To override one or more entries for your own cluster/dataset, create
# input/resources.yaml containing just the rules/keys you want to change
# (it's deep-merged on top of this file, so a partial override is fine, e.g.
# just `resources: {star_align: {mem_mb: 64000}}`). See "HPC / SLURM" in the
# README.
#
# Every rule reads its entry here via get_resources("<rule_name>") in
# common.smk; a rule missing from this file (or a missing key within an
# entry) falls back to the _default entry below rather than failing. Values
# below are reasonable starting points for a human genome / typical bulk
# RNA-seq run -- adjust to your organism, read depth, and cluster.
# =============================================================================
# Runtime floor for trivial rules
# ------------------------------
# A cluster job's wall clock is its WORK plus its OVERHEAD -- SLURM start-up,
# the python/snakemake import, and conda activation, all over shared NFS.
# For the rules that just read a handful of small files and write one JSON,
# the work is a fraction of a second and the overhead is everything, and it
# is not bounded by anything this workflow controls.
#
# benchmark_summary proved that the hard way: it aggregates ~75 tiny
# benchmark files, measured at 0.3 s of actual work, and still hit SLURM
# TIMEOUT at runtime: 10. Every rule below that did seconds of work had the
# same 10-15 minute limit and the same exposure, so the floor for all of them
# is now 30 minutes. Runtime is a limit, not a reservation -- an unused 30
# minutes costs nothing, while a job killed at 10 costs a re-run.
#
# This floor is NOT for rules that do real work; those keep limits sized from
# measurement (see star_index, telocal_locind, chimera_telocal_index).

resources:
  _default:
    threads: 1
    mem_mb: 4000
    runtime: 60
  gunzip_reference:
    threads: 1
    mem_mb: 2000
    runtime: 30

  # Lane/run merging (cat): single-threaded, streaming I/O.
  cat_fastq:
    threads: 1
    mem_mb: 1000
    runtime: 120

  # TrimGalore! + FastQC: TrimGalore! passes --cores {threads} through to
  # cutadapt and runs FastQC inside. Modest CPU; I/O bound. Paired-end keeps
  # 4 threads; single-end runs with 2 (retuned after an 84-sample run).
  trim_galore_pe:
    threads: 4
    mem_mb: 8000
    runtime: 180

  trim_galore_se:
    threads: 2
    mem_mb: 8000
    runtime: 180

  # Always-on raw FastQC (per sample/read): modest CPU/memory; I/O bound.
  # FastQC -t 1 is enough; a second core is wasted.
  fastqc_raw:
    threads: 1
    mem_mb: 2000
    runtime: 30

  star_index:
    # Peak memory for STAR genome index generation scales with genome size;
    # ~32-40GB is typical for a human/mouse-sized genome (SA index).
    # 2 threads: genome generation barely scales past a couple of cores, so
    # the threads are spent on cluster throughput instead; runtime limit
    # raised to compensate for the slower build.
    threads: 2
    mem_mb: 40000
    runtime: 360

  gtf_to_genepred:
    threads: 1
    mem_mb: 2000
    runtime: 30

  genepred_to_bed12:
    threads: 1
    mem_mb: 2000
    runtime: 30

  star_align:
    # STAR keeps the whole genome index in memory per job; ~2.5x the index's
    # on-disk size is a safe estimate for human/mouse. 2 threads per job
    # trades wall time for cluster throughput (more samples aligned in
    # parallel); the runtime limit is raised accordingly.
    #
    # 32000 was NOT enough on a real run: star.two_pass: cohort passes
    # --sjdbFileChrStartEnd merged_SJ.out.tab, and STAR's "inserting
    # junctions into the genome indices" step does one large, sudden
    # reallocation around every novel junction in that pooled file --
    # SLURM's cgroup OOM killer fired on a real GRCm38 job (sacct:
    # State=OUT_OF_ME+, exit 0:125) with polled MaxRSS at 31.9 GiB, just
    # under the 32000M request; the actual instantaneous peak that
    # triggered the kill was necessarily higher than that polled sample
    # (RSS polling is periodic, the OOM killer fires the instant a
    # cgroup is overcommitted, so a sudden spike can be killed before
    # the next poll captures it). star_align_pass1 and
    # star_align_for_assembly run the SAME insertion against the SAME
    # merged_SJ.out.tab and genome, so they carry the identical risk on
    # any sample, not just the one that happened to fail first -- all
    # three are bumped together.
    threads: 2
    mem_mb: 45000
    runtime: 600

  star_align_pass1:
    # Cohort-wide 2-pass mapping, stage 1 (star.two_pass: cohort) -- a
    # throwaway per-sample alignment for splice-junction discovery only
    # (--outSAMtype None, no BAM). Memory is still dominated by loading the
    # whole genome index (same as star_align); runtime is lower since there
    # is no BAM write/sort/chimeric-detection overhead, but unbenchmarked --
    # kept equal to star_align's until measured on a real run.
    #
    # mem_mb raised alongside star_align/star_align_for_assembly -- see
    # star_align's comment for the real OOM this fixes. Pass 1 does not
    # itself take --sjdbFileChrStartEnd (it's what DISCOVERS the novel
    # junctions merged_SJ.out.tab pools), but it loads the identical base
    # genome index, so it is kept at the same budget rather than left an
    # outlier.
    threads: 2
    mem_mb: 45000
    runtime: 600

  star_merge_junctions:
    # Single-threaded python; reads every sample's pass-1 SJ.out.tab (small
    # text files, not BAMs) and writes one filtered/merged file. Base 2 GB +
    # 50 MB per sample.
    threads: 1
    mem_mb: 2000
    mem_per_sample: 50
    runtime: 30

  samtools_sort:
    # Coordinate sorting is I/O-bound in practice; measured runs used <=3
    # cores regardless of allocation, so 2 threads suffice. -m per-thread
    # memory scales with threads (see align.smk), keeping total under mem_mb.
    threads: 2
    mem_mb: 16000
    runtime: 120

  samtools_index:
    threads: 2
    mem_mb: 4000
    runtime: 30

  rseqc_infer_experiment:
    threads: 1
    mem_mb: 4000
    runtime: 60

  samtools_flagstat:
    # Just tallies SAM flag bits over the sorted BAM; single-threaded aside
    # from the -@ decompression helper, small and fast.
    threads: 1
    mem_mb: 1000
    runtime: 30

  rseqc_read_distribution:
    # Same shape as rseqc_infer_experiment: one pass over the BAM against
    # the BED12 gene model, single-threaded.
    threads: 1
    mem_mb: 4000
    runtime: 60

  rseqc_gene_body_coverage:
    # Heavier than infer_experiment/read_distribution's single streaming
    # pass: geneBody_coverage.py pileups each transcript from its first to
    # its last exonic base -- the whole genomic span, introns included -- to
    # sample 100 points, so the cost is sum(genomic span x depth) over
    # transcripts, in pure Python. It has no internal parallelism, so
    # threads: 1 is the tool's limit, not a conservative choice. The rule
    # thins the BED12 to ~1000 transcripts first (see bam_qc.smk), which is
    # what keeps this in minutes rather than hours; runtime below is headroom
    # for that thinned model.
    threads: 1
    mem_mb: 8000
    runtime: 120

  determine_strandedness:
    threads: 1
    mem_mb: 1000
    runtime: 30

  tecount:
    # TEcount/TEtranscripts is single-threaded (no --threads flag), so a
    # single core is the right allocation. Memory is dominated by loading the
    # TE + gene annotation; ~8-12GB covers a human/mouse dataset.
    threads: 1
    mem_mb: 12000
    runtime: 240

  telocal:
    # TElocal is single-threaded like TEcount. Memory is dominated by the
    # .locInd index (a pickled balanced binary tree over 500-bp bins).
    # Measured on an 84-sample run: 158% RAM efficiency at 12 GB (~19 GB
    # peak RSS) -- a full-genome TE annotation needs more than the
    # "8-12GB" human/mouse estimate this default started from. Bumped to
    # keep ~80% efficiency (~19GB / 0.8).
    threads: 1
    mem_mb: 24000
    runtime: 240

  telocal_locind:
    # TElocal_indexer builds the locus index from the TE GTF.  Memory is
    # dominated by loading the full TE annotation into a balanced binary
    # tree; ~30GB is typical for a human/mouse genome with a comprehensive
    # TE GTF.  Build time is pure-Python and single-threaded (no
    # parallelism available in TElocal_Toolkit) -- but see
    # build_telocal_index.py's _fast_build(): the tree insertion itself
    # was never the bottleneck (profiled at <10% of runtime); an O(n^2)
    # list-membership check in TElocal's own TEfeatures.build() was --
    # ~98s of a ~125s run at 200k instances, in isolation. Fixed (an
    # auxiliary set, same list order preserved) and verified against the
    # original: identical output, 0 mismatches across 20k+ random queries,
    # ~19-28x faster measured at 200k instances. Since the fixed cost was
    # quadratic, runtime dropped from ~24h (3 consecutive real timeouts on
    # a GRCm38 rmsk-derived TE GTF, millions of instances) to an estimated
    # low tens of minutes at that same scale -- not re-benchmarked at full
    # scale, so this budget still leaves real headroom rather than cutting
    # it close.
    threads: 1
    mem_mb: 32000
    runtime: 180

  telocal_locations:
    # Per-TE chrom/start/end/strand lookup table: one streaming pass over
    # the TE GTF, no tree/index built. Memory is dominated by the
    # dedup-by-key set (millions of TE keys); ~4GB covers a human/mouse
    # TE GTF.
    threads: 1
    mem_mb: 4000
    runtime: 30

  telocal_counts:
    # Merging per-sample TElocal cntTables into the counts matrix;
    # single-threaded.  Locus-level tables are much larger than TEcount's
    # (one row per TE instance), so the per-sample allowance is higher.
    #
    # 2000 + 200/sample was NOT enough on a real run: tecount_counts.py holds
    # one Python dict per sample, ALL of them simultaneously, until every
    # sample has been read (needed to build the feature union before
    # writing) -- 84 samples x up to ~3.7M TE loci each, real GRCm38 scale.
    # SLURM's cgroup OOM killer fired (sacct: State=OUT_OF_ME+, exit 0:125)
    # against the 18800M budget that formula gave at 84 samples.
    #
    # tecount_counts.py now interns each locus-key string (sys.intern) --
    # every sample shares the SAME ~3.7M-locus vocabulary, but str.split()
    # allocated an independent string object per line per file, so the old
    # code held up to 84 separate copies of what is really one shared key
    # set. Interning collapses those to one shared object per unique key;
    # dict lookup behavior (and the output) is unchanged. Measured on a
    # same-shape synthetic case at reduced scale: 66% peak-memory reduction.
    # Real per-sample dict-slot and int-value overhead is untouched by
    # interning, though, and this cannot be re-measured at the true
    # 3.7M-locus x 84-sample scale outside the real HPC data -- so the
    # per-sample allowance is raised with real margin on top of the fix,
    # not cut close to whatever the reduction alone might suffice for.
    threads: 1
    mem_mb: 3000
    mem_per_sample: 400
    runtime: 60

  telocal_qc_transform:
    # log2/vst/rlog on the TElocal counts matrix; R is single-threaded.
    # Memory scales with sample count.  Measured on an 84-sample run: 120%
    # RAM efficiency at base 4 GB + 250 MB/sample (~30GB peak RSS at 84
    # samples). Scaled up 1.5x to keep ~80% efficiency: base 6 GB + 375 MB
    # per sample (~37.5GB at 84 samples).
    threads: 1
    mem_mb: 6000
    mem_per_sample: 375
    runtime: 120

  telocal_qc:
    # PCA + sample-distance heatmap in R; single-threaded.
    threads: 1
    mem_mb: 8000
    runtime: 30

  tetranscripts_diffexp:
    # Pools every treatment/control BAM in a contrast at once, so scales
    # with both annotation size and total mapped reads across all samples.
    threads: 4
    mem_mb: 32000
    runtime: 360

  # ---- TEcounts sample-QC (only when tetranscripts.qc.enabled) ----------
  # These rules only run when tetranscripts.qc.enabled is true (the default,
  # see common.smk); the entries are inert otherwise.

  tecount_counts:
    # Merging per-sample cntTables into the counts matrix; single-threaded.
    # Memory scales with sample count.  Base 2 GB + 50 MB per sample.
    threads: 1
    mem_mb: 2000
    mem_per_sample: 50
    runtime: 30

  tecount_qc_transform:
    # DESeq2 vst/rlog on the TEcounts counts matrix; R is single-threaded.
    # Memory scales with sample count.  Base 4 GB + 150 MB per sample.
    threads: 1
    mem_mb: 4000
    mem_per_sample: 150
    runtime: 60

  tecount_qc:
    # PCA + sample-distance heatmap in R; single-threaded.
    threads: 1
    mem_mb: 8000
    runtime: 30

  tecount_summary:
    # Per-sample TEcounts summary barplots (assignment + TE class) in pure
    # python; single-threaded, streaming I/O over the raw cntTables.
    threads: 1
    mem_mb: 2000
    runtime: 30

  # ---- Chimera gene-TE junction screen (only when enabled) ----------------
  # These rules only run when chimera.enabled is true (see common.smk); the
  # entries are inert otherwise.

  annotation_to_bed:
    # Pure-python GTF->BED conversion; single-threaded. NOT small: te.bed
    # holds one row per TE INSERTION (not per subfamily), so the parse
    # accumulates one entry per insertion -- millions on a real annotation.
    # Measured 1.8 GB peak RSS on GRCm38 rmsk (3.7M instances) after the
    # storage was made lean (plain lists + interned repeated strings); it
    # was 3.3 GB before that, which OOM'd against the old 2 GB allowance.
    # 6 GB leaves real headroom for a larger annotation (e.g. human, or a
    # more comprehensive rmsk set) rather than sitting just above mouse.
    threads: 1
    mem_mb: 6000
    runtime: 30

  chimera_reads_classify:
    # Annotating a junction file against the gene/TE tracks; single-threaded
    # python.
    threads: 1
    mem_mb: 8000
    runtime: 120

  chimera_telocal_index:
    # Builds the merged all-samples TElocal interval index ONCE (previously
    # rebuilt from scratch in every chimera_telocal_annotate job -- see that
    # rule's comment). Same TE-locus universe as telocal_locind, but reads
    # already-computed cntTables rather than the raw TE GTF, and stores a
    # compact columnar/vocab-deduped structure (chimera_telocal_index.py)
    # rather than telocal_locind's balanced-tree pickle -- sized similarly
    # to telocal_locind as a starting point pending a real measurement,
    # since both index the same locus universe. Runs once per pipeline run,
    # not once per sample, so a generous allocation here is far cheaper in
    # aggregate than the old per-sample formula.
    threads: 1
    mem_mb: 32000
    runtime: 180

  chimera_telocal_annotate:
    # Cross-references one sample's junction table against the shared
    # TElocal interval index (chimera_telocal_index, built once) --
    # single-threaded python. No longer scales with sample count: this job
    # only deserializes the one fixed-size index and processes one sample's
    # junctions, unlike the old per-job full-rebuild-from-text version that
    # measured 563% RAM efficiency at "base 4GB + 200MB/sample" on an
    # 84-sample run (~4000+200*84=20800MB request vs. ~117GB actual --
    # rebuilding the index from raw text in every one of 84 jobs was both
    # the redundant-work problem AND, we now believe, most of the memory
    # problem). Flat allocation, generous pending a real measurement of the
    # new pickle-deserialize-only shape.
    threads: 1
    mem_mb: 8000
    runtime: 60

  chimera_reads_counts:
    # Merging per-sample junction tables; single-threaded python (2 threads
    # reserved as scheduler headroom).  Loads all unique events into a
    # single Python dict -- peak RSS scales linearly with sample count.
    # Measured on an 84-sample run: >200% RAM efficiency at base 4 GB +
    # 150 MB/sample, ~12 GB peak RSS.  Base 2 GB + 125 MB per sample
    # (~12.5 GB at 84 samples).
    threads: 2
    mem_mb: 2000
    mem_per_sample: 125
    runtime: 30

  chimera_reads_qc:
    threads: 1
    mem_mb: 2000
    runtime: 30

  chimera_reads_qc_barplot:
    # Merging the per-sample junction QC tables into one MultiQC bar-plot
    # JSON; single-threaded, small (2nd core reserved as scheduler headroom).
    threads: 2
    mem_mb: 500
    runtime: 30

  chimera_evidence:
    # Collapses both screens' tables to one row per (gene, TE) pair; holds
    # both in memory, so it scales with event count -> with cohort size.
    threads: 2
    mem_mb: 1000
    mem_per_sample: 60
    runtime: 30


  chimera_reads_te_type:
    # Sums three metrics per sample and counts classes in one table.
    threads: 1
    mem_mb: 1000
    mem_per_sample: 50
    runtime: 30

  chimera_candidates_table:
    # Renders the top-N rows of candidates.tsv.gz; holds the table in memory.
    threads: 1
    mem_mb: 1000
    mem_per_sample: 100
    runtime: 30

  chimera_candidates_explorer:
    # Builds one self-contained DT widget over the FULL candidates catalogue
    # (all rows, not top-N); the data.frame, DT's JSON serialization, and
    # pandoc's self-contained bundling step all hold the whole catalogue in
    # memory at once, so this scales with cohort size like chimera_evidence.
    # The rule's own shell step awk-filters genes.bed/te.bed down to just the
    # candidates' gene_id/te_id BEFORE R ever runs -- those BEDs are
    # genome-wide (te.bed especially: millions of rows for a real
    # mouse/human TE annotation), and loading the unfiltered files OOM-killed
    # a real run at 2.4 GB. Measured after that fix, at real-cohort scale
    # (~31k candidates, a 4M-row/240MB synthetic te.bed standing in for a
    # real genome-wide TE annotation): R's peak RSS was ~1.1 GB. mem_mb below
    # is set with real headroom above that measurement, not tightly to it --
    # pandoc runs as a subprocess during the self-contained bundling step and
    # its own memory isn't captured by that measurement.
    threads: 1
    mem_mb: 4000
    mem_per_sample: 100
    runtime: 60

  chimera_assembly_qc_transform:
    # log2-transforms the assembly TPM matrix for the QC view.
    threads: 1
    mem_mb: 2000
    mem_per_sample: 200
    runtime: 30

  chimera_assembly_qc:
    # PCA + sample-distance plots from the transformed assembly matrix.
    threads: 1
    mem_mb: 2000
    mem_per_sample: 200
    runtime: 30

  chimera_evidence_guide:
    # Counts evidence flags across candidates.tsv.gz; holds the table in
    # memory, so it scales with cohort size like its siblings.
    threads: 1
    mem_mb: 1000
    mem_per_sample: 100
    runtime: 30

  chimera_evidence_heatmap:
    # Ranks every evidence column of chimera_evidence.tsv.gz; holds the table
    # plus one rank vector per dimension, so it scales with cohort size.
    threads: 2
    mem_mb: 1000
    mem_per_sample: 60
    runtime: 30

  chimera_reads_highlights:
    # Ranks the merged gene<->TE table for the report's "what to look at"
    # section.  Holds that table in memory, so it scales with the number of
    # events -- which scales with cohort size, hence mem_per_sample.
    threads: 2
    mem_mb: 1000
    mem_per_sample: 60
    runtime: 30

  chimera_reads_igv_bed:
    threads: 2
    mem_mb: 2000
    runtime: 30

  chimera_reads_sample_qc_transform:
    # DESeq2 vst/rlog on the chimera counts matrix; R is single-threaded.
    # Memory scales with sample count.  Re-measured on an 84-sample run at
    # the prior "base 2 GB + 125 MB/sample" setting: 442% RAM efficiency
    # (~55 GB peak RSS) -- that retune undershot. Scaled up 5.5x to keep
    # ~80% efficiency: base 11 GB + 700 MB per sample (~70 GB at 84
    # samples).
    threads: 1
    mem_mb: 11000
    mem_per_sample: 700
    runtime: 60

  chimera_reads_sample_qc:
    # DESeq2 transform + PCA in R; single-threaded.  Memory scales with
    # sample count.
    # Base 4 GB + 150 MB per sample.
    threads: 1
    mem_mb: 4000
    mem_per_sample: 150
    runtime: 30

  multiqc:
    threads: 1
    mem_mb: 4000
    runtime: 30

  benchmark_summary:
    threads: 1
    mem_mb: 2000
    runtime: 30

  config_used:
    threads: 1
    mem_mb: 2000
    runtime: 30

  gene_name_lookup:
    # One streaming pass over the gene GTF, holding one entry per gene.
    threads: 1
    mem_mb: 2000
    runtime: 30

  strandedness_check:
    # Parses one small RSeQC report per sample into a table.
    threads: 1
    mem_mb: 500
    runtime: 30

  evidence_overview:
    # Writes one small HTML section from params only -- no inputs.
    threads: 1
    mem_mb: 500
    runtime: 30

  # ---------------------------------------------------------------------------
  # chimera_assembly.smk (off by default, config chimera.assembly.enabled).
  # Unbenchmarked on real data at time of writing -- these are starting
  # points, not measured values; retune once you have a real run's numbers
  # (see the "chore: retune default resources" pattern elsewhere in this
  # file for what that update should look like).
  # ---------------------------------------------------------------------------
  star_align_for_assembly:
    # Same shape as star_align/star_align_pass1: STAR keeps the whole genome
    # index in memory regardless of output type, so mem_mb matches those.
    # This is the rule that actually OOM-killed on a real run -- see
    # star_align's comment for the measurement and the shared root cause
    # (--sjdbFileChrStartEnd merged_SJ.out.tab's junction-insertion spike).
    threads: 2
    mem_mb: 45000
    runtime: 600

  stringtie_assemble:
    # Single-sample de novo assembly; scales with read depth and splice
    # complexity, not genome size the way STAR does.
    threads: 2
    mem_mb: 8000
    runtime: 120

  stringtie_merge:
    # Aggregates over ALL samples' assemblies -- the DAG sync point for this
    # screen (star_merge_junctions' shape). Base 4 GB + 300 MB per sample.
    threads: 1
    mem_mb: 4000
    mem_per_sample: 300
    runtime: 90

  stringtie_requantify:
    # Re-quantification against a fixed structure is lighter than de novo
    # assembly.
    threads: 2
    mem_mb: 6000
    runtime: 90

  chimera_assembly_classify:
    # Single-threaded python; loads the merged GTF + genes/exons/te BED
    # tracks into memory once (not per sample).
    threads: 1
    mem_mb: 6000
    runtime: 60

  chimera_assembly_quantify:
    # Reads every sample's requantified GTF once. Base 2 GB + 150 MB per
    # sample.
    threads: 1
    mem_mb: 2000
    mem_per_sample: 150
    runtime: 30

  chimera_assembly_cross_evidence:
    # Single-threaded python; one table join, no per-sample scaling.
    threads: 1
    mem_mb: 2000
    runtime: 30

  chimera_assembly_summary_mqc:
    # Single-threaded python; reads the candidates table + TPM matrix once,
    # writes two small JSON files.
    threads: 1
    mem_mb: 2000
    runtime: 30

  chimera_assembly_igv_bed:
    # Single-threaded python; one pass over the candidates table.
    threads: 1
    mem_mb: 2000
    runtime: 30
